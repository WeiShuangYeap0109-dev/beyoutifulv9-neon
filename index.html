;font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#f7f5f2}.time-row{display:contents}.time-label{padding:12px 6px;color:var(--muted);font-size:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.slot{min-height:76px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.slot-empty{color:#ddd;font-size:11px}.status-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.month-select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-width:170px}.login-screen{position:fixed;inset:0;background:#f4f2ef;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.login-card{width:min(420px,100%);background:#fff;border:1px solid #e6e1da;border-radius:20px;padding:28px;box-shadow:0 18px 60px #0001}.login-brand{font-weight:800;letter-spacing:2px;font-size:22px}.login-sub{font-size:10px;color:#77736d;letter-spacing:2px;margin-top:5px}.login-title{font-size:24px;font-weight:750;margin:28px 0 18px}.login-error{color:#9a514b;background:#f4e5e3;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;display:none}.logout-btn{margin-left:8px}.mobileNav{display:none}.dup-warning{display:none;background:#fff3e6;border:1px solid #e2b07a;color:#7a4b17;border-radius:10px;padding:10px;font-size:12px;line-height:1.45}.dup-warning.show{display:block}@media(max-width:800px){.side{display:none}.main{margin-left:0;width:100%;padding:18px;padding-bottom:80px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.mobileNav{display:flex;position:fixed;z-index:4;bottom:0;left:0;right:0;background:#171717;padding:8px 10px;justify-content:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}.mobileNav button{flex:0 0 auto;white-space:nowrap;background:none;border:0;color:#aaa;font-size:11px;padding:8px 5px}.mobileNav button.active{color:#fff}.title{font-size:23px} <script>
const API='/api/data';
const ACCOUNTS={belle:{name:'Belle',role:'owner',password:'Belle2026!'},jieyun:{name:'Jie Yun',role:'staff',password:'Jieyun2026!'},kelly:{name:'Kelly',role:'staff',password:'Kelly2026!'},test:{name:'Test Staff',role:'staff',password:'Test2026!'}};
const SERVICES=[{name:'深层清洁护理',price:128,duration:120,active:true},{name:'Lash Lift',price:158,duration:90,active:true},{name:'REJUVENATION 焕肤护理',price:238,duration:90,active:true},{name:'美甲',price:88,duration:90,active:true},{name:'嫁接睫毛',price:128,duration:120,active:true},{name:'野生眉',price:168,duration:90,active:true},{name:'纹绣补色',price:199,duration:120,active:true},{name:'Lash Touch Up',price:58,duration:30,active:true}];
const STAFF=['Belle','Jieyun','Kelly','Test Staff'];let currentUser=null,page='home',syncing=false,orderServiceCount=1,data={customers:[],appointments:[],orders:[],packages:[],usage:[],services:[],packageTransactions:[],commissions:[],nextCustomer:1};
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return 'RM '+Number(n||0).toFixed(2)}function localDate(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function minutes(t){const [h,m]=String(t||'').split(':').map(Number);return Number.isFinite(h)&&Number.isFinite(m)?h*60+m:null}function calcEndTime(start,duration){const s=minutes(start);if(s===null)return '';const t=s+Number(duration||0);return `${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}function service(n){return SERVICES.find(s=>s.name===n)||{name:n,price:0,duration:90}}function toast(m){alert(m)}
function normalizeServices(list){return (Array.isArray(list)?list:[]).filter(s=>s&&String(s.name||'').trim()).map(s=>({name:String(s.name).trim(),price:Number(s.price||0),duration:Math.max(1,Number(s.duration||90)),active:s.active!==false}))}
function applyServices(list){SERVICES.splice(0,SERVICES.length,...normalizeServices(list))}
function localServices(){try{const x=JSON.parse(localStorage.getItem('beyoutiful_services')||'null');return normalizeServices(x)}catch(e){return []}}
async function loadData(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('Database API error '+r.status);data=await r.json();for(const k of ['customers','appointments','orders','packages','usage','packageTransactions','commissions'])if(!Array.isArray(data[k]))data[k]=[];if(!Array.isArray(data.services))data.services=[];const remote=normalizeServices(data.services),local=localServices();let merged=remote.slice();for(const x of local){if(!merged.some(y=>y.name===x.name))merged.push(x)}if(!merged.length)merged=normalizeServices(SERVICES);const servicesChanged=merged.length!==remote.length||remote.some((x,i)=>{const m=merged[i];return !m||x.name!==m.name||x.price!==m.price||x.duration!==m.duration||x.active!==m.active});applyServices(merged);data.services=SERVICES.map(x=>({...x}));if(servicesChanged)await save();data.nextCustomer=Number(data.nextCustomer||1);data.customers.forEach(c=>{c.birthday??='';c.remark??='' });data.appointments.forEach(a=>{a.endTime??=calcEndTime(a.time,service(a.service).duration||90);a.remark??='' });data.orders.forEach(o=>{o.discount=Number(o.discount||0);o.originalAmount=o.originalAmount===undefined?Number(o.amount||0)+o.discount:Number(o.originalAmount||0)})}
async function save(){if(syncing)return;syncing=true;try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Database save failed '+r.status)}finally{syncing=false}}
async function saveSnapshot(next){if(syncing)throw Error('系统正在保存，请稍后再试');syncing=true;try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});if(!r.ok)throw Error('Database save failed '+r.status)}finally{syncing=false}}
function navItems(){const x=[['home','Home'],['customers','Customers'],['appointments','Appointments'],['orders','Orders'],['packages','Package Balance'],['performance','My Performance']];if(currentUser?.role==='owner')x.push(['finance','Sales'],['settings','Settings']);return x}function renderNav(){const h=navItems().map(([k,l])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');$('nav').innerHTML=h;$('mobileNav').innerHTML=h}function applyPermissions(){if(currentUser)$('welcome').textContent=`${currentUser.name} · ${currentUser.role==='owner'?'Owner':'Staff'}`}function go(p){page=p;$('pageTitle').textContent=navItems().find(x=>x[0]===p)?.[1]||'Home';render()}function render(){if(!currentUser)page='home';if(!navItems().some(x=>x[0]===page))page='home';renderNav();const v=$('view');v.innerHTML=page==='home'?homeView():page==='customers'?customersView():page==='appointments'?appointmentsView():page==='orders'?ordersView():page==='packages'?packagesView():page==='performance'?performanceView():page==='finance'?financeView():settingsView()}
const VAPID_PUBLIC_KEY='BP37RZQcQCFUeBNmHjxoK5U-xcxrObtnAssXNXuhwlgoDGLtF0aKIhGpTO9I_PTzJVUxt6vAKArw0N0cRwmJg9k';

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding)
    .replace(/-/g,'+')
    .replace(/_/g,'/');
  const rawData=window.atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

async function registerPush(username){
  try{
    if(!('Notification' in window)||!('serviceWorker' in navigator))return {ok:false,error:'此浏览器不支持 Notification 或 Service Worker'};
    if(!('PushManager' in window))return {ok:false,error:'此浏览器不支持 PushManager；请使用加入主屏幕的网页 App'};

    const permission=await Notification.requestPermission();
    if(permission!=='granted')return {ok:false,error:'通知权限没有开启：'+permission};

    const reg=await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    let subscription=await reg.pushManager.getSubscription();
    if(!subscription){
      subscription=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    const response=await fetch('/api/push-subscribe',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:String(username).toLowerCase(),subscription})
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok||result.ok!==true)throw Error(result.error||'登记通知设备失败：HTTP '+response.status);
    console.log('Push registered',result);
    return {ok:true,result};
  }catch(err){
    console.error('Push error',err);
    return {ok:false,error:err?.message||String(err)};
  }
}


function doLogin(e){e.preventDefault();const k=$('loginAccount').value,a=ACCOUNTS[k],err=$('loginError');if(!a||$('loginPassword').value!==a.password){err.style.display='block';return}currentUser={key:k,name:a.name,role:a.role};sessionStorage.setItem('beyoutiful_user',JSON.stringify(currentUser));$('loginScreen').style.display='none';err.style.display='none';applyPermissions();render()}
async function enableNotifications(){
  if(!currentUser)return toast('请先登入');
  const result=await registerPush(currentUser.key);
  if(result.ok){
    const endpoint=result.result?.endpoint||'';
    toast('预约通知设备登记成功！\n账号：'+currentUser.key+'\n现在可以测试新增预约。');
  }else{
    toast('预约通知开启失败：\n\n'+result.error);
  }
}
function logout(){sessionStorage.removeItem('beyoutiful_user');currentUser=null;$('loginScreen').style.display='flex'}function monthKey(date){return String(date||'').slice(0,7)}function currentMonthKey(){return localDate().slice(0,7)}function monthLabel(key){const [y,m]=String(key||currentMonthKey()).split('-').map(Number);if(!y||!m)return key;return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}function monthOptions(){const keys=new Set(data.orders.map(o=>monthKey(o.date)).filter(Boolean));keys.add(currentMonthKey());return Array.from(keys).sort().reverse()}function ordersForMonth(key){return data.orders.filter(o=>monthKey(o.date)===key)}function homeView(){const month=currentMonthKey(),monthOrders=ordersForMonth(month),rev=monthOrders.reduce((a,o)=>a+Number(o.amount||0),0),today=localDate(),ap=data.appointments.filter(a=>a.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const revenueCard=currentUser?.role==='owner'?`<div class="card"><div class="muted">Revenue</div><div class="stat">${money(rev)}</div></div>`:'';return `<div class="section-head"><div><h3 style="margin:0">This Month</h3><div class="muted">${esc(monthLabel(month))}</div></div></div><div class="grid stats">${revenueCard}<div class="card"><div class="muted">Completed Orders</div><div class="stat">${monthOrders.length}</div></div><div class="card"><div class="muted">Customers</div><div class="stat">${data.customers.length}</div></div><div class="card"><div class="muted">Appointments This Month</div><div class="stat">${data.appointments.filter(a=>monthKey(a.date)===month).length}</div></div></div><div class="card section"><b>Today</b>${ap.length?ap.map(a=>`<div class="row"><div><b>${esc(a.time)}–${esc(a.endTime||'')} · ${esc(apptCustomer(a))}</b><div class="muted">${esc(a.service)} · ${esc(a.staff)}</div></div><span class="pill ${a.status==='Completed'?'ok':''}">${apptStatusLabel(a.status)}</span></div>`).join(''):'<div class="empty">No appointments today.</div>'}</div>`}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}

function customersView(){const q=String(window.customerQuery||'').trim().toLowerCase();const list=data.customers.filter(c=>!q||String(c.name||'').toLowerCase().includes(q)||String(c.phone||'').toLowerCase().includes(q)||String(c.id||'').toLowerCase().includes(q));return `<div class="toolbar"><button class="btn dark" onclick="openCustomer()">＋ New Customer</button><input class="btn" style="min-width:240px" placeholder="🔍 Search name / phone / ID" value="${esc(window.customerQuery||'')}" oninput="window.customerQuery=this.value;render()"><button class="btn" onclick="window.customerQuery='';render()">Clear</button></div><div class="card"><div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Birthday</th><th>Remark</th><th>旧配套</th></tr></thead><tbody>${list.map(c=>`<tr onclick="openCustomerDetail('${esc(c.id)}')" style="cursor:pointer"><td>${esc(c.id)}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${esc(c.birthday||'—')}</td><td>${esc(c.remark||'—')}</td><td><button class="btn" onclick="event.stopPropagation();openHistoricalPackage('${esc(c.id)}')">＋ 添加</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching customers</td></tr>'}</tbody></table></div></div>`}
function customerDuplicateHTML(nameId,phoneId,boxId){return `<div id="${boxId}" class="dup-warning"></div>`}function checkCustomerDuplicate(nameId,phoneId,boxId,excludeId=''){const box=$(boxId);if(!box)return;const name=String($(nameId)?.value||'').trim().toLowerCase(),phone=String($(phoneId)?.value||'').replace(/\D/g,'');const dn=name&&data.customers.find(c=>c.id!==excludeId&&String(c.name||'').trim().toLowerCase()===name),dp=phone&&data.customers.find(c=>c.id!==excludeId&&String(c.phone||'').replace(/\D/g,'')===phone);if(!dn&&!dp){box.classList.remove('show');box.innerHTML='';return}const parts=[];if(dn)parts.push(`姓名「${esc(dn.name)}」已存在（${esc(dn.id)}）`);if(dp)parts.push(`电话号码「${esc(dp.phone||'')}」已存在（${esc(dp.name)} / ${esc(dp.id)}）`);box.innerHTML='⚠️ 可能是重复顾客：<br>'+parts.join('<br>')+'<br><span style="opacity:.8">保存时系统还会再次确认。</span>';box.classList.add('show')}function openCustomer(){openModal('New Customer',`<form class="form" onsubmit="addCustomer(event)"><div class="field"><label>Name *</label><input id="cName" required oninput="checkCustomerDuplicate('cName','cPhone','cDup')"></div><div id="cDup" class="dup-warning"></div><div class="two"><div class="field"><label>Phone</label><input id="cPhone" oninput="checkCustomerDuplicate('cName','cPhone','cDup')"></div><div class="field"><label>Birthday</label><input id="cBirthday" type="date"></div></div><div class="field"><label>Customer Remark</label><textarea id="cRemark"></textarea></div><button class="btn dark">Save Customer</button></form>`)}
function openCustomerEdit(id){const c=data.customers.find(x=>x.id===id);if(!c)return;openModal('Edit Customer Info',`<form class="form" onsubmit="saveCustomerInfo(event,'${esc(id)}')"><div class="summary"><div><span>Customer ID</span><b>${esc(c.id)}</b></div></div><div class="field"><label>Name *</label><input id="ecName" required value="${esc(c.name)}" oninput="checkCustomerDuplicate('ecName','ecPhone','ecDup','${esc(id)}')"></div><div id="ecDup" class="dup-warning"></div><div class="field"><label>Phone</label><input id="ecPhone" value="${esc(c.phone||'')}" oninput="checkCustomerDuplicate('ecName','ecPhone','ecDup','${esc(id)}')"></div><div class="field"><label>Birthday</label><input id="ecBirthday" type="date" value="${esc(c.birthday||'')}"></div><div class="field"><label>Customer Remark</label><textarea id="ecRemark">${esc(c.remark||'')}</textarea></div><button class="btn dark">Save Customer Info</button></form>`)}
async function saveCustomerInfo(e,id){e.preventDefault();const c=data.customers.find(x=>x.id===id);if(!c)return;const name=$('ecName').value.trim(),phone=$('ecPhone').value.trim(),n=name.toLowerCase(),ph=phone.replace(/\D/g,'');const dupName=data.customers.find(x=>x.id!==id&&String(x.name||'').trim().toLowerCase()===n),dupPhone=ph&&data.customers.find(x=>x.id!==id&&String(x.phone||'').replace(/\D/g,'')===ph);if(dupName||dupPhone){const parts=[];if(dupName)parts.push(`姓名「${dupName.name}」已存在（${dupName.id}）`);if(dupPhone)parts.push(`电话号码「${dupPhone}」已存在（${dupPhone.name} / ${dupPhone.id}）`);if(!confirm('⚠️ 发现可能重复的顾客资料：\n\n'+parts.join('\n')+'\n\n确定还是要保存吗？'))return}c.name=name;c.phone=phone;c.birthday=$('ecBirthday').value;c.remark=$('ecRemark').value.trim();await save();closeModal();render();toast('顾客资料已更新')}
function openCustomerDetail(id){const c=data.customers.find(x=>x.id===id);if(!c)return;const visits=data.orders.filter(o=>o.customerId===id).slice().reverse(),appts=data.appointments.filter(a=>a.customerId===id).slice().reverse(),ps=data.packages.filter(p=>p.customerId===id);openModal(c.name,`<div class="form"><div class="card" style="padding:14px"><b>顾客资料 / Customer Info</b><div class="muted" style="margin:5px 0 10px">可以修改姓名、电话号码、生日和备注。</div><button type="button" class="btn dark" onclick="openCustomerEdit('${esc(id)}')">✎ Edit Customer Info</button>${currentUser?.key==='belle'?`<button type="button" class="btn" onclick="sendPackageBalanceWhatsApp('${esc(id)}')">📲 发余额 + Expired</button>`:''}</div><div class="card" style="padding:14px"><b>旧配套 / Opening Balance</b><div class="muted" style="margin:5px 0 10px">App 上线前购买、现在还剩的余额可以直接录入。</div><button type="button" class="btn" onclick="openHistoricalPackage('${esc(id)}')">＋ 添加旧配套</button></div><div class="summary"><div><span>Customer ID</span><b>${esc(c.id)}</b></div><div><span>Name</span><b>${esc(c.name)}</b></div><div><span>Phone</span><b>${esc(c.phone||'—')}</b></div><div><span>Birthday</span><b>${esc(c.birthday||'—')}</b></div><div><span>Remark</span><b>${esc(c.remark||'—')}</b></div></div><div class="section"><b>Visit History & Remarks</b>${visits.length?visits.map(o=>`<div class="row"><div><b>${esc(o.date)} · ${esc(o.service||'')}</b><div class="muted">${esc(o.billing)} · ${money(o.amount)}</div>${Number(o.discount||0)>0?`<div class="muted">Original ${money(o.originalAmount)} · Discount ${money(o.discount)}</div>`:''}<div style="margin-top:5px">${esc(o.remark||'No visit remark')}</div></div></div>`).join(''):'<div class="empty">No visit records yet.</div>'}</div><div class="section"><b>Package Balance</b>${ps.length?ps.map(p=>p.packageType==='value'?`<div class="row"><div><b>Value 配套 · Any Service</b><div class="muted">Total ${money(p.totalValue||0)} · Used ${money((p.totalValue||0)-(p.valueBalance||0))}</div></div><b>Balance ${money(p.valueBalance||0)}</b></div>`:`<div class="row"><div><b>${esc(p.service)}</b><div class="muted">${p.times} purchased · ${p.used} used</div></div><b>Balance ${Math.max(0,p.times-p.used)} 次</b></div>`).join(''):'<div class="empty">No packages.</div>'}</div><div class="section"><b>Appointments</b>${appts.length?appts.map(a=>`<div class="row"><div><b>${esc(a.date)} · ${esc(a.time)}–${esc(a.endTime||'')}</b><div class="muted">${esc(a.service)} · ${esc(a.staff)}</div></div><span class="pill">${apptStatusLabel(a.status)}</span></div>`).join(''):'<div class="empty">No appointments.</div>'}</div>${currentUser?.role==='owner'?`<button class="btn danger" onclick="deleteCustomer('${esc(id)}')">🗑️ 删除这个顾客</button>`:''}</div>`)}
function addCustomer(e){e.preventDefault();const name=$('cName').value.trim(),phone=$('cPhone').value.trim();const n=name.toLowerCase(),ph=phone.replace(/\D/g,'');const dupName=data.customers.find(c=>String(c.name||'').trim().toLowerCase()===n),dupPhone=ph&&data.customers.find(c=>String(c.phone||'').replace(/\D/g,'')===ph);if(dupName||dupPhone){const parts=[];if(dupName)parts.push(`姓名「${dupName.name}」已存在（${dupName.id}）`);if(dupPhone)parts.push(`电话号码「${dupPhone}」已存在（${dupPhone.name} / ${dupPhone.id}）`);if(!confirm('⚠️ 发现可能重复的顾客资料：\n\n'+parts.join('\n')+'\n\n确定还是要建立新顾客吗？'))return}data.customers.push({id:'C'+String(data.nextCustomer++).padStart(3,'0'),name,phone,birthday:$('cBirthday').value,remark:$('cRemark').value.trim()});save().then(()=>{closeModal();render();toast('顾客已加入')})}
async function deleteCustomer(id){if(currentUser?.role!=='owner')return toast('只有 Owner 可以删除顾客');const c=data.customers.find(x=>x.id===id);if(!c||!confirm(`确定要删除顾客「${c.name}」吗？\n\n顾客资料、预约、订单、配套余额及使用记录都会一起删除。\n\n这个操作不能恢复。`))return;data.customers=data.customers.filter(x=>x.id!==id);data.appointments=data.appointments.filter(x=>x.customerId!==id);data.orders=data.orders.filter(x=>x.customerId!==id);data.packages=data.packages.filter(x=>x.customerId!==id);data.usage=data.usage.filter(x=>x.customerId!==id);data.commissions=(data.commissions||[]).filter(x=>x.customerId!==id);try{await save();closeModal();render();toast('顾客已删除')}catch(e){alert('删除失败，请检查数据库连接。')}}
/* APPOINTMENTS */
function apptStatusLabel(s){return ({Booked:'已预约',Confirmed:'已确认',Completed:'已完成',Cancelled:'已取消',Rescheduled:'已改期'})[s]||s||'已预约'}function apptCustomer(a){return data.customers.find(c=>c.id===a.customerId)?.name||a.customerName||'—'}function apptPhone(a){return data.customers.find(c=>c.id===a.customerId)?.phone||a.customerPhone||''}
function appointmentConflict(date,start,end,staff,exclude=''){const s=minutes(start),e=minutes(end);if(s===null||e===null||e<=s)return null;return data.appointments.find(a=>a.id!==exclude&&a.date===date&&a.staff===staff&&a.status!=='Cancelled'&&s<minutes(a.endTime||calcEndTime(a.time,service(a.service).duration||90))&&e>minutes(a.time))}function conflictMessage(a){return `⚠️ 预约冲突\n\n${a.staff} 在 ${a.date} ${a.time}–${a.endTime||''} 已有预约：\n\n${apptCustomer(a)} · ${a.service}\n\n请换时间或换员工。`}
function apptChip(a){return `<button class="appt-chip ${a.status==='Cancelled'?'cancelled':''}" onclick="openAppointmentEdit('${esc(a.id)}')"><b>${esc(a.time)}–${esc(a.endTime||'')}</b> ${esc(apptCustomer(a))}<small>${esc(apptPhone(a))} · ${esc(a.service)} · ${a.status==='Cancelled'?'已取消':esc(a.staff)}</small></button>`}
function appointmentMonthView(y,m){const first=new Date(Date.UTC(y,m,1)),last=new Date(Date.UTC(y,m+1,0)),start=first.getUTCDay(),cells=[];for(let i=0;i<start;i++)cells.push('<div class="cal-cell muted-cell"></div>');for(let d=1;d<=last.getUTCDate();d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,list=data.appointments.filter(a=>a.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));cells.push(`<div class="cal-cell ${ds===localDate()?'today':''}"><div class="cal-date">${d}</div>${list.slice(0,4).map(apptChip).join('')}${list.length>4?`<div class="more">+${list.length-4} more</div>`:''}</div>`)}return `<div class="calendar">${cells.join('')}</div>`}
function appointmentDayView(date){const times=[];for(let h=9;h<=21;h++)times.push(`${String(h).padStart(2,'0')}:00`);return `<div class="schedule-scroll"><div class="schedule-grid"><div class="time-head"></div>${STAFF.map(s=>`<div class="staff-head">${s}</div>`).join('')}${times.map(t=>`<div class="time-row"><div class="time-label">${t}</div>${STAFF.map(st=>{const ap=data.appointments.filter(a=>a.date===date&&a.staff===st&&a.status!=='Cancelled'&&minutes(a.time)>=minutes(t)&&minutes(a.time)<minutes(t)+60);return `<div class="slot">${ap.map(apptChip).join('')}${!ap.length?'<span class="slot-empty">—</span>':''}</div>`}).join('')}</div>`).join('')}</div></div>`}
function appointmentsView(){const d=localDate(),p=d.split('-').map(Number),y=Number(window.apptYear||p[0]),m=Number.isInteger(window.apptMonth)?window.apptMonth:p[1]-1,selected=window.apptDate||d;return `<div class="toolbar"><button class="btn dark" onclick="openAppointment()">＋ New Appointment</button><span class="muted" style="align-self:center">📅 可将预约加入 Google Calendar</span><div class="view-switch"><button class="btn ${window.apptView!=='day'?'dark':''}" onclick="setApptView('month')">Month</button><button class="btn ${window.apptView==='day'?'dark':''}" onclick="setApptView('day')">Day</button></div>${window.apptView==='day'?`<input class="btn" type="date" value="${selected}" onchange="selectApptDate(this.value)">`:''}</div><div class="card">${window.apptView==='day'?`<div class="section-head"><div><b>${selected}</b><div class="muted">Start Time – End Time · 点击预约可修改</div></div></div>${appointmentDayView(selected)}`:`<div class="calendar-head"><button class="btn" onclick="changeApptMonth(-1)">‹</button><b>${y}年 ${m+1}月</b><button class="btn" onclick="changeApptMonth(1)">›</button></div><div class="weekdays">${['日','一','二','三','四','五','六'].map(x=>`<b>${x}</b>`).join('')}</div>${appointmentMonthView(y,m)}`}</div><div class="card section"><div class="section-head"><b>预约状态</b><span class="muted">点击任何预约可修改</span></div><div class="status-legend"><span>● 已预约</span><span>● 已确认</span><span>● 已完成</span><span>● 已改期</span><span>● 已取消</span></div></div>`}
function setApptView(v){window.apptView=v;render()}function changeApptMonth(n){const d=new Date(Date.UTC(Number(window.apptYear||new Date().getFullYear()),Number.isInteger(window.apptMonth)?window.apptMonth:new Date().getMonth(),1));d.setUTCMonth(d.getUTCMonth()+n);window.apptYear=d.getUTCFullYear();window.apptMonth=d.getUTCMonth();render()}function selectApptDate(v){window.apptDate=v;const [y,m]=v.split('-').map(Number);window.apptYear=+y;window.apptMonth=+m-1;render()}
function customerSearchHTML(prefix,id=''){const c=data.customers.find(x=>x.id===id);return `<div class="field customer-search"><label>Customer（可搜姓名或电话号码）</label><input id="${prefix}CustomerSearch" autocomplete="off" placeholder="输入姓名 / 电话号码" value="${c?esc(c.name):''}" oninput="searchCustomer('${prefix}',this.value)" onfocus="searchCustomer('${prefix}',this.value)"><input type="hidden" id="${prefix}Customer" value="${esc(id)}"><div id="${prefix}CustomerResults" class="customer-results" style="display:none"></div><div id="${prefix}SelectedCustomer" class="selected-customer" style="${c?'':'display:none'}">${c?`<b>${esc(c.name)}</b><div class="muted">📞 ${esc(c.phone||'未填写电话')} · ID ${esc(c.id)}</div>`:''}</div></div>`}
function searchCustomer(prefix,q){const box=$(prefix+'CustomerResults');if(!box)return;const term=String(q||'').trim().toLowerCase();const list=data.customers.filter(c=>!term||String(c.name||'').toLowerCase().includes(term)||String(c.phone||'').toLowerCase().includes(term));box.innerHTML=list.slice(0,30).map(c=>`<button type="button" class="customer-result" onclick="selectCustomer('${prefix}','${esc(c.id)}')"><b>${esc(c.name)}</b><div class="muted">📞 ${esc(c.phone||'未填写电话')} · ID ${esc(c.id)}</div></button>`).join('')||'<div class="empty">找不到顾客</div>';box.style.display='block'}function selectCustomer(prefix,id){const c=data.customers.find(x=>x.id===id);if(!c)return;$(prefix+'Customer').value=id;$(prefix+'CustomerSearch').value=c.name;$(prefix+'SelectedCustomer').style.display='block';$(prefix+'SelectedCustomer').innerHTML=`<b>${esc(c.name)}</b><div class="muted">📞 ${esc(c.phone||'未填写电话')} · ID ${esc(c.id)}</div>`;$(prefix+'CustomerResults').style.display='none';if(prefix==='a')refreshAppointmentEnd();if(prefix==='o')refreshOrder()}document.addEventListener('click',e=>{if(!e.target.closest('.customer-search'))document.querySelectorAll('.customer-results').forEach(x=>x.style.display='none')});
function openAppointment(){openModal('New Appointment',`<form class="form" onsubmit="addAppointment(event)"><div class="two"><div class="field"><label>Date</label><input id="aDate" type="date" required value="${localDate()}"></div><div class="field"><label>Start Time</label><input id="aTime" type="time" required oninput="refreshAppointmentEnd()"></div></div><div class="field"><label>顾客</label><select id="aCustomerMode" onchange="toggleAppointmentCustomerMode()"><option value="existing">已有顾客</option><option value="new">新顾客 · 尚未建档</option></select></div><div id="aExistingCustomer">${customerSearchHTML('a')}</div><div id="aNewCustomer" style="display:none"><div class="two"><div class="field"><label>姓名 *</label><input id="aGuestName"></div><div class="field"><label>电话</label><input id="aGuestPhone"></div></div><div class="muted">预约会先保存为临时顾客，到店后可再建立正式 Customer。</div></div><div class="two"><div class="field"><label>Service</label><select id="aService" onchange="refreshAppointmentEnd()">${SERVICES.filter(s=>s.active!==false).map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Staff</label><select id="aStaff">${(currentUser?.role==='staff'?[currentUser.name]:STAFF).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>End Time（自动计算，可修改）</label><input id="aEndTime" type="time" required></div><div class="field"><label>Service Duration</label><input id="aDuration" disabled></div></div><div class="field"><label>预约备注</label><textarea id="aRemark"></textarea></div><button class="btn dark">Save Appointment</button></form>`);refreshAppointmentEnd()}
function refreshAppointmentEnd(){const s=$('aTime'),e=$('aEndTime'),sv=$('aService'),du=$('aDuration');if(!s||!e||!sv)return;const d=service(sv.value).duration||90;if(s.value)e.value=calcEndTime(s.value,d);if(du)du.value=d+' min'}
function formatTime12(t){const [h,m]=String(t||'').split(':').map(Number);if(!Number.isFinite(h)||!Number.isFinite(m))return t||'';const ap=h>=12?'PM':'AM',hh=h%12||12;return `${hh}:${String(m).padStart(2,'0')} ${ap}`}
function whatsappPhone(phone){let p=String(phone||'').replace(/\D/g,'');if(!p)return '';if(p.startsWith('0'))p='60'+p.slice(1);if(!p.startsWith('60'))p='60'+p;return p}
function sendWhatsAppReminder(id){if(currentUser?.key!=='belle')return toast('只有 Belle 可以发送 WhatsApp 预约提醒');const a=data.appointments.find(x=>x.id===id);if(!a)return;const c=data.customers.find(x=>x.id===a.customerId);if(!c?.phone)return toast('这个顾客没有电话号码');const phone=whatsappPhone(c.phone);const msg=`Hi 🤍\n\nBeyoutiful Studio & Academy\n预约提醒 ✨\n\nHi ${c.name||'顾客'}，温馨提醒您：\n\n📅 日期：${a.date}\n⏰ 时间：${formatTime12(a.time)}\n💆🏻‍♀️ 项目：${a.service}\n👩🏻‍💼 美容师：${a.staff}\n预约保留15分钟\n\n📍 地点：Beyoutiful Studio & Academy\nGoogle Maps: https://www.google.com/maps/search/?api=1&query=Beyoutiful%20Studio%20%26%20Academy%2C%20Bukit%20Mertajam%2C%20Penang\n\n为了确保预约时间及服务安排顺利进行，\n如需更改或取消预约，请至少提前 1 天通知我们。\n\n谢谢您的配合 🤍\n期待见到您。\n\nBeyoutiful Studio & Academy`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank')}
function googleCalendarUrl(a){
  const c=data.customers.find(x=>x.id===a.customerId);
  const title=`${a.service||'Beyoutiful Appointment'} · ${c?.name||a.customerName||'Customer'}`;
  const start=String(a.date||'').replace(/-/g,'')+'T'+String(a.time||'00:00').replace(':','')+'00';
  const end=String(a.date||'').replace(/-/g,'')+'T'+String(a.endTime||a.time||'00:00').replace(':','')+'00';
  const details=[
    'Beyoutiful Studio & Academy',
    `Service: ${a.service||''}`,
    `Staff: ${a.staff||'No Staff'}`,
    a.remark?`Remark: ${a.remark}`:''
  ].filter(Boolean).join('\n');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start}/${end}&ctz=Asia%2FKuala_Lumpur&details=${encodeURIComponent(details)}&location=${encodeURIComponent('Beyoutiful Studio & Academy, Bukit Mertajam, Penang')}`;
}
function openGoogleCalendar(id){
  const a=data.appointments.find(x=>x.id===id);
  if(!a)return toast('找不到预约');

async function sendAppointmentPush(action,a){
  try{
    const c=data.customers.find(x=>x.id===a.customerId);
    const response=await fetch('/api/push-appointment',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,customerName:c?.name||a.customerName||'Guest',service:a.service,date:a.date,time:a.time,staff:a.staff})
    });
    const result=await response.json().catch(()=>({}));
    console.log('Appointment push result',result);
    if(!response.ok||result.ok!==true){
      alert('预约已保存，但推送后台失败：\n'+(result.error||'HTTP '+response.status));
      return result;
    }
    if(Number(result.matchedSubscriptions||0)===0){
      alert('预约已保存，但没有找到该员工的通知设备。\n\n目标账号：'+(result.targetUsername||a.staff)+'\n请用该员工账号重新点击「开启预约通知」。');
    }else if(Array.isArray(result.results)&&result.results.some(x=>x.ok===false)){
      alert('预约已保存，但通知发送失败：\n'+JSON.stringify(result.results,null,2));
    }else{
      console.log('预约通知发送成功',result);
    }
    return result;
  }catch(err){
    console.error('Appointment push error',err);
    alert('预约已保存，但无法连接预约通知接口：\n'+(err?.message||String(err)));
  }
}

async function deleteOrder(id){
 if(currentUser?.key!=='belle')return toast('只有 Belle 可以删除订单');
 const o=data.orders.find(x=>x.id===id);if(!o)return toast('找不到订单');
 const serviceName=Array.isArray(o.items)?o.items.map(x=>x.service).join(' + '):o.service||'';
 if(!confirm(`确定删除这张订单吗？\n\n${o.date||''} · ${o.customerName||''} · ${serviceName}\n\n系统会先检查并回滚配套余额、Package Transactions、Usage 与 Commission。\n任何一步失败都会取消删除，不会留下半套账。`))return;
 const next=JSON.parse(JSON.stringify(data)),target=next.orders.find(x=>x.id===id);
 try{
  if(!target)throw Error('找不到订单');
  if(target.billing==='购买配套'&&target.packageId){
   const hasUsage=(next.usage||[]).some(u=>u.orderId!==id&&u.packageId===target.packageId);if(hasUsage)throw Error('这个购买配套已经有使用记录，不能删除，以免配套余额和账目出错。');
   const pi=next.packages.findIndex(p=>p.id===target.packageId);if(pi<0)throw Error('找不到对应配套，已停止删除。');next.packages.splice(pi,1);next.packageTransactions=(next.packageTransactions||[]).filter(t=>t.orderId!==id&&t.packageId!==target.packageId);
  }
  if(target.billing==='使用配套'&&target.packageId){
   const usageList=next.usage||[];let ui=usageList.findIndex(u=>u.orderId===id),u=ui>=0?usageList[ui]:null;
   if(!u){const items=Array.isArray(target.items)?target.items:[{service:target.service||'',staff:target.staff||''}],item=items[0]||{},fallback=usageList.map((x,i)=>({x,i})).reverse().find(z=>z.x.customerId===target.customerId&&z.x.packageId===target.packageId&&z.x.service===item.service&&z.x.staff===item.staff&&z.x.date===target.date&&Number(z.x.used||0)===1);if(fallback){u=fallback.x;ui=fallback.i}}
   if(!u)throw Error('找不到对应的 Usage 记录，已停止删除。订单没有被删除。');
   const allocations=Array.isArray(u.packageAllocations)&&u.packageAllocations.length?u.packageAllocations:(Array.isArray(target.packageAllocations)&&target.packageAllocations.length?target.packageAllocations:null);if(!allocations)throw Error('旧订单缺少精确的配套扣减明细，无法安全回滚。订单没有被删除。');
   for(const a of allocations){const p=next.packages.find(x=>x.id===a.packageId);if(!p)throw Error(`找不到配套 ${a.packageId}，已停止删除。`);if(p.packageType==='value')p.valueBalance=Number(p.valueBalance||0)+Number(a.value||0);else p.used=Math.max(0,Number(p.used||0)-Number(a.times||0));}
   usageList.splice(ui,1);next.packageTransactions=(next.packageTransactions||[]).filter(t=>t.orderId!==id&&t.id!==u.transactionId);next.commissions=(next.commissions||[]).filter(c=>c.orderId!==id&&c.usageId!==u.id);
  }else{next.packageTransactions=(next.packageTransactions||[]).filter(t=>t.orderId!==id);next.commissions=(next.commissions||[]).filter(c=>c.orderId!==id)}
  const oi=next.orders.findIndex(x=>x.id===id);if(oi<0)throw Error('订单不存在，已停止删除。');next.orders.splice(oi,1);
  await saveSnapshot(next);data=next;closeModal();render();toast('订单已删除，相关配套与业绩已同步回滚');
 }catch(err){console.error(err);alert('删除失败，订单没有删除。\n\n原因：'+(err?.message||'未知错误')+'\n\n系统已保留原账目，防止账目被删乱。')}
}

function printReceipt(id){const o=data.orders.find(x=>x.id===id);if(!o)return toast('找不到订单');const c=data.customers.find(x=>x.id===o.customerId),items=Array.isArray(o.items)&&o.items.length?o.items:[{service:o.service||'',staff:o.staff||'',amount:o.amount||0}];const rows=items.map(i=>`<tr><td>${esc(i.service||'')}</td><td>${esc(i.staff||'No Staff')}</td><td style="text-align:right">RM ${Number(i.amount||0).toFixed(2)}</td></tr>`).join('');const win=window.open('','_blank');if(!win)return toast('请允许弹出窗口');win.document.write(`<!doctype html><html><head><title>Receipt ${esc(o.id)}</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;max-width:700px;margin:30px auto;padding:20px;color:#111}h1{font-size:22px;letter-spacing:1px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px 4px;border-bottom:1px solid #ddd;text-align:left}.total{font-size:20px;font-weight:700;text-align:right;margin-top:20px}.muted{color:#666;font-size:13px}@media print{button{display:none}}</style></head><body><h1>BEYOUTIFUL STUDIO & ACADEMY</h1><div class="muted">Receipt / Invoice</div><p><b>No:</b> ${esc(o.id)}<br><b>Date:</b> ${esc(o.date||'')}<br><b>Customer:</b> ${esc(c?.name||o.customerName||'')}</p><table><thead><tr><th>Service</th><th>Staff</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rows}</tbody></table><p><b>Type:</b> ${esc(o.billing||'')}<br><b>Payment:</b> ${esc(o.payment||'—')}</p><div class="total">TOTAL RM ${Number(o.amount||0).toFixed(2)}</div><p class="muted">${esc(o.remark||'')}<br><br>Thank you for choosing Beyoutiful Studio.</p><button onclick="window.print()">Print / Save PDF</button></body></html>`);win.document.close()}
async function saveServices(){data.services=SERVICES.map(s=>({...s}));await save();try{localStorage.setItem('beyoutiful_services',JSON.stringify(data.services))}catch(e){}}
function openServiceEditor(i){const s=i==null?{name:'',price:'',duration:90,active:true}:SERVICES[i];openModal(i==null?'Add Service':'Edit Service',`<form class="form" onsubmit="saveService(event,${i==null?'null':i})"><div class="field"><label>项目名称 *</label><input id="sName" required value="${esc(s.name)}"></div><div class="two"><div class="field"><label>单次价格</label><input id="sPrice" type="number" min="0" step="0.01" value="${s.price??''}"></div><div class="field"><label>服务时间（分钟）</label><input id="sDuration" type="number" min="1" value="${s.duration||90}"></div></div><label><input id="sActive" type="checkbox" ${s.active!==false?'checked':''}> 启用这个项目</label><button class="btn dark">Save Service</button></form>`)}async function saveService(e,i){e.preventDefault();const x={name:$('sName').value.trim(),price:Number($('sPrice').value||0),duration:Math.max(1,Number($('sDuration').value||90)),active:$('sActive').checked};if(!x.name)return toast('请输入项目名称');if(i===null)SERVICES.push(x);else SERVICES[i]=x;try{await saveServices();closeModal();render();toast('项目已保存')}catch(err){toast('保存失败，请检查数据库连接')}}
function settingsView(){return `<div class="card"><div class="top" style="padding:0"><div><h3 style="margin:0">Services</h3><div class="muted">自己新增项目、价格和服务时间</div></div><button class="btn dark" onclick="openServiceEditor()">＋ Add Service</button></div><div class="section">${SERVICES.map((s,i)=>`<div class="row"><div><b>${esc(s.name)}</b><div class="muted">${money(s.price)} · ${s.duration||90} min · ${s.active!==false?'启用':'停用'}</div></div><button class="btn" onclick="openServiceEditor(${i})">Edit</button></div>`).join('')}</div></div><div class="card section"><h3 style="margin-top:0">Historical / Opening Balance</h3><div class="muted">旧顾客余额从顾客详情加入，不会计入今天营业额。</div></div><div class="card section"><button class="btn danger" onclick="resetData()">Reset Demo Data</button></div>`}
function openHistoricalPackage(id){const c=data.customers.find(x=>x.id===id);if(!c)return;openModal('Add Historical / Opening Balance',`<form class="form" onsubmit="saveHistoricalPackage(event,'${esc(id)}')"><div class="muted">旧顾客在 App 上线以前已经购买、现在仍有余额的配套，可以直接把「剩余」录入系统。</div><div class="field"><label>配套类型</label><select id="hType" onchange="toggleHistoricalFields()"><option value="times">次数配套</option><option value="value">Value 配套 · Any Service</option></select></div><div id="hServiceField" class="field"><label>适用项目</label><select id="hService">${SERVICES.filter(s=>s.active!==false).map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div id="hTimesFields"><div class="two"><div class="field"><label>原购买次数</label><input id="hTimes" type="number" min="1" value="3"></div><div class="field"><label>现在剩余次数 *</label><input id="hRemaining" type="number" min="0" value="3"></div></div></div><div id="hValueFields" style="display:none"><div class="two"><div class="field"><label>购买 Value</label><input id="hBuyValue" type="number" min="0" step="0.01"></div><div class="field"><label>赠送 Value</label><input id="hBonusValue" type="number" min="0" step="0.01"></div></div><div class="two"><div class="field"><label>Total PKG Value</label><input id="hTotalValue" type="number" min="0" step="0.01"></div><div class="field"><label>现在剩余 Value *</label><input id="hBalanceValue" type="number" min="0" step="0.01"></div></div></div><div class="two"><div class="field"><label>原购买日期</label><input id="hDate" type="date"></div><div class="field"><label>Expired Date</label><input id="hExpiry" type="date"></div></div><div class="field"><label>原配套售价</label><input id="hPrice" type="number" min="0" step="0.01"></div></div><div class="field"><label>备注</label><textarea id="hRemark"></textarea></div><button class="btn dark">✓ Save Opening Balance</button></form>`)}function toggleHistoricalFields(){const v=$('hType').value;$('hServiceField').style.display=v==='times'?'block':'none';$('hTimesFields').style.display=v==='times'?'block':'none';$('hValueFields').style.display=v==='value'?'block':'none'}function saveHistoricalPackage(e,id){e.preventDefault();const c=data.customers.find(x=>x.id===id),type=$('hType').value,date=$('hDate').value||localDate(),price=Number($('hPrice').value||0),remark=$('hRemark').value.trim();if(type==='times'){const t=Math.max(1,Number($('hTimes').value||1)),r=Math.max(0,Math.min(t,Number($('hRemaining').value||0)));data.packages.push({id:'P'+Date.now(),customerId:id,customerName:c.name,service:$('hService').value,times:t,used:t-r,price,originalTotal:price,packageType:'times',source:'historical',purchasedAt:date,remark,expiredAt:$('hExpiry').value||''})}else{const buy=Number($('hBuyValue').value||0),bonus=Number($('hBonusValue').value||0),total=Number($('hTotalValue').value||0)||buy+bonus,bal=Math.max(0,Math.min(total,Number($('hBalanceValue').value||0)));if(total<=0)return toast('请输入 Total PKG Value');data.packages.push({id:'P'+Date.now(),customerId:id,customerName:c.name,service:'Any Service',times:0,used:0,price,originalTotal:0,packageType:'value',source:'historical',purchasedAt:date,remark,buyValue:buy,bonusValue:bonus,totalValue:total,valueBalance:bal,expiredAt:$('hExpiry').value||''})}save().then(()=>{closeModal();render();toast('旧配套余额已加入，不计入营业额')})}
async function resetData(){if(!confirm('确定清除数据库里的全部 V10 数据？'))return;const r=await fetch(API,{method:'DELETE'});if(!r.ok)return alert('清除失败');location.reload()}
let savedUser=null;try{savedUser=JSON.parse(sessionStorage.getItem('beyoutiful_user')||'null')}catch(e){sessionStorage.removeItem('beyoutiful_user')}if(savedUser&&ACCOUNTS[savedUser.key]&&ACCOUNTS[savedUser.key].role===savedUser.role){currentUser=savedUser;$('loginScreen').style.display='none'}(async()=>{try{await loadData()}catch(e){console.error(e)}finally{applyPermissions();render();if(!currentUser)$('loginScreen').style.display='flex'}})();
</script>
</body></html>
