<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Beyoutiful Studio — Management</title>
<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#171717;--muted:#77736d;--line:#e6e1da;--dark:#171717;--ok:#55745c;--danger:#9a514b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:240px;background:#171717;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;letter-spacing:1.5px;font-size:18px}.sub{font-size:10px;color:#aaa;margin-top:4px;letter-spacing:1.8px}.nav{margin-top:34px;display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:12px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#2b2b2b;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:28px;font-weight:750}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px}.btn.dark{background:#171717;color:#fff;border-color:#171717}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat{font-size:28px;font-weight:750;margin-top:8px}.section{margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;font-size:11px}.pill.ok{background:#e6eee8;color:var(--ok)}.pill.danger{background:#f4e5e3;color:var(--danger)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:600}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modalbox{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.form{display:grid;gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:80px;resize:vertical}.billing{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.billing label{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px}.billing input{display:none}.billing input:checked+span{font-weight:700}.billing label:has(input:checked){border-color:#171717;background:#f5f3ef}.summary{background:#f6f4f1;border-radius:12px;padding:14px}.summary div{display:flex;justify-content:space-between;padding:4px 0}.hidden{display:none!important}.mobileNav{display:none}
@media(max-width:800px){.side{display:none}.main{margin-left:0;width:100%;padding:18px;padding-bottom:80px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.mobileNav{display:flex;position:fixed;z-index:4;bottom:0;left:0;right:0;background:#171717;padding:8px;justify-content:space-around}.mobileNav button{background:none;border:0;color:#aaa;font-size:11px}.mobileNav button.active{color:#fff}.top{gap:10px}.title{font-size:23px}.table{min-width:680px}.scroll{overflow:auto}.billing{grid-template-columns:1fr}}

.appt-toolbar{align-items:center}.view-switch{display:flex;gap:6px;margin-left:auto}.date-control{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}.calendar-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal-cell{min-height:125px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;overflow:hidden}.cal-cell.today{outline:2px solid #171717}.muted-cell{background:#faf9f7}.cal-date{font-weight:700;font-size:13px;margin-bottom:5px}.appt-chip{display:block;width:100%;border:1px solid #ddd7cf;background:#f6f4f1;border-radius:8px;text-align:left;padding:5px 6px;margin:4px 0;font-size:11px;line-height:1.2;overflow:hidden}.appt-chip b{font-size:11px}.appt-chip small{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appt-chip.cancelled{opacity:.5;text-decoration:line-through}.more{font-size:10px;color:var(--muted);padding-top:3px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.schedule-scroll{overflow:auto}.schedule-grid{display:grid;grid-template-columns:62px repeat(3,minmax(170px,1fr));min-width:600px;border-top:1px solid var(--line)}.time-head{border-right:1px solid var(--line)}.staff-head{padding:11px;text-align:center;font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#f7f5f2}.time-row{display:contents}.time-label{padding:12px 6px;color:var(--muted);font-size:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.slot{min-height:76px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.slot-empty{color:#ddd;font-size:11px}.status-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
@media(max-width:800px){.view-switch{margin-left:0}.calendar{min-width:720px}.calendar+.x{display:none}.calendar-head{justify-content:space-between}.cal-cell{min-height:110px}.schedule-grid{grid-template-columns:54px repeat(3,160px)}}

.login-screen{position:fixed;inset:0;background:#f4f2ef;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e6e1da;border-radius:20px;padding:28px;box-shadow:0 18px 60px #0001}
.login-brand{font-weight:800;letter-spacing:2px;font-size:22px}
.login-sub{font-size:10px;color:#77736d;letter-spacing:2px;margin-top:5px}
.login-title{font-size:24px;font-weight:750;margin:28px 0 18px}
.login-error{color:#9a514b;background:#f4e5e3;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;display:none}
.account-list{display:grid;gap:10px;margin-top:12px}
.account-btn{width:100%;text-align:left;border:1px solid #e6e1da;background:#fff;border-radius:12px;padding:14px}
.account-btn:hover{background:#f6f4f1}
.account-role{display:block;color:#77736d;font-size:11px;margin-top:3px}
.logout-btn{margin-left:8px}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">BEYOUTIFUL</div>
    <div class="login-sub">STUDIO & ACADEMY</div>
    <div class="login-title">Management Login</div>
    <div class="login-error" id="loginError">账号或密码不正确</div>
    <form class="form" onsubmit="doLogin(event)">
      <div class="field"><label>Account</label><select id="loginAccount">
        <option value="belle">Belle</option>
        <option value="jieyun">Jie Yun</option>
        <option value="kelly">Kelly</option>
      </select></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <button class="btn dark">Login</button>
    </form>
    <div class="muted" style="margin-top:14px">V9 登录测试版</div>
  </div>
</div>

<div class="app">
<aside class="side">
  <div class="brand">BEYOUTIFUL</div><div class="sub">STUDIO & ACADEMY</div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <div class="top"><div><div class="title" id="pageTitle">Home</div><div class="muted" id="welcome">Beyoutiful Studio Management</div></div><div><button class="btn dark" onclick="openOrder()">＋ New Order</button><button class="btn logout-btn" onclick="logout()">Logout</button></div></div>
  <div id="view"></div>
</main>
<div class="mobileNav" id="mobileNav"></div>
</div>

<div class="modal" id="modal">
 <div class="modalbox"><div class="modalhead"><h3 id="modalTitle" style="margin:0"></h3><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div>
</div>

<script>
const KEY='beyoutiful_v9_neon';
const API='/api/data';
let syncing=false;
const ACCOUNTS={
  belle:{name:'Belle',role:'owner',password:'Belle2026!'},
  jieyun:{name:'Jie Yun',role:'staff',password:'Jieyun2026!'},
  kelly:{name:'Kelly',role:'staff',password:'Kelly2026!'}
};
let currentUser=null;
function doLogin(e){
  e.preventDefault();
  const key=document.getElementById('loginAccount').value;
  const pw=document.getElementById('loginPassword').value;
  const a=ACCOUNTS[key];
  const err=document.getElementById('loginError');
  if(!a||pw!==a.password){err.style.display='block';return;}
  currentUser={key,name:a.name,role:a.role};
  sessionStorage.setItem('beyoutiful_user',JSON.stringify(currentUser));
  err.style.display='none';
  document.getElementById('loginScreen').style.display='none';
  applyPermissions();
  render();
}
function logout(){
  sessionStorage.removeItem('beyoutiful_user');
  currentUser=null;
  document.getElementById('loginScreen').style.display='flex';
}
function applyPermissions(){
  if(!currentUser)return;
  const isOwner=currentUser.role==='owner';
  document.getElementById('welcome').textContent=`${currentUser.name} · ${isOwner?'Owner':'Staff'}`;
}
function navItems(){
  const base=[['home','Home'],['customers','Customers'],['appointments','Appointments'],['orders','Orders'],['packages','Package Balance']];
  if(currentUser?.role==='owner')base.push(['finance','Finance'],['settings','Settings']);
  return base;
}
function enforcePagePermission(){
  if(!currentUser){page='home';return;}
  const allowed=navItems().some(x=>x[0]===page);
  if(!allowed)page='home';
}

const SERVICES=[
 {name:'深层清洁护理',price:128,duration:120},
 {name:'Lash Lift',price:158,duration:90},
 {name:'REJUVENATION 焕肤护理',price:238,duration:90},
 {name:'美甲',price:88,duration:90},
 {name:'嫁接睫毛',price:128,duration:120},
 {name:'野生眉',price:168,duration:90},
 {name:'纹绣补色',price:199,duration:120}
];
const STAFF=['Belle','Jieyun','Kelly'];
let data={
  customers:[],
  appointments:[],
  orders:[],
  packages:[],
  usage:[],
  nextCustomer:1
};
async function loadData(){
  const r=await fetch(API,{cache:'no-store'});
  if(!r.ok) throw new Error('Database API error '+r.status);
  const d=await r.json();
  data=d;
  if(!Array.isArray(data.customers))data.customers=[];
  if(!Array.isArray(data.appointments))data.appointments=[];
  if(!Array.isArray(data.orders))data.orders=[];
  if(!Array.isArray(data.packages))data.packages=[];
  if(!Array.isArray(data.usage))data.usage=[];
  data.nextCustomer=Number(data.nextCustomer||1);
  data.customers.forEach(c=>{if(c.birthday===undefined)c.birthday='';if(c.remark===undefined)c.remark=''});
}
async function save(){
  if(syncing)return;
  syncing=true;
  try{
    const r=await fetch(API,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
    if(!r.ok) throw new Error('Database save failed '+r.status);
  }finally{syncing=false;}
}
function money(n){return 'RM '+Number(n||0).toFixed(2)}
function service(name){return SERVICES.find(s=>s.name===name)||{name,price:0}}
function toast(msg){alert(msg)}

function go(p){page=p;document.getElementById('pageTitle').textContent=navItems().find(x=>x[0]===p)?.[1]||'Home';renderNav();render()}
function render(){
 enforcePagePermission();
 renderNav();
 const v=document.getElementById('view');
 if(page==='home')v.innerHTML=homeView();
 if(page==='customers')v.innerHTML=customersView();
 if(page==='appointments')v.innerHTML=appointmentsView();
 if(page==='orders')v.innerHTML=ordersView();
 if(page==='packages')v.innerHTML=packagesView();
 if(page==='finance')v.innerHTML=financeView();
 if(page==='settings')v.innerHTML=settingsView();
}
function homeView(){
 const rev=data.orders.reduce((a,o)=>a+Number(o.amount||0),0);
 const today=new Date().toISOString().slice(0,10);
 const ap=data.appointments.filter(a=>a.date===today);
 return `<div class="grid stats">
 <div class="card"><div class="muted">Revenue</div><div class="stat">${money(rev)}</div></div>
 <div class="card"><div class="muted">Completed Orders</div><div class="stat">${data.orders.length}</div></div>
 <div class="card"><div class="muted">Customers</div><div class="stat">${data.customers.length}</div></div>
 <div class="card"><div class="muted">Appointments</div><div class="stat">${data.appointments.length}</div></div></div>
 <div class="card section"><b>Today</b>${ap.length?ap.map(a=>{const c=data.customers.find(x=>x.id===a.customerId);return `<div class="row"><div><b>${a.time} · ${c?.name||''}</b><div class="muted">${a.service} · ${a.staff}</div></div><span class="pill ${a.status==='Completed'?'ok':''}">${a.status}</span></div>`}).join(''):'<div class="empty">No appointments today.</div>'}</div>`;
}
function customersView(){
 return `<div class="toolbar"><button class="btn dark" onclick="openCustomer()">＋ New Customer</button></div><div class="card"><div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Birthday</th><th>Remark</th><th>旧配套</th></tr></thead><tbody>${data.customers.map(c=>`<tr onclick="openCustomerDetail('${c.id}')" style="cursor:pointer"><td>${c.id}</td><td><b>${c.name}</b></td><td>${c.phone||'—'}</td><td>${c.birthday||'—'}</td><td>${c.remark||'—'}</td><td><button class="btn" onclick="event.stopPropagation();openHistoricalPackage('${c.id}')">＋ 添加</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No customers</td></tr>'}</tbody></table></div></div>`;
}
function openCustomerDetail(customerId){
 const c=data.customers.find(x=>x.id===customerId);
 if(!c)return;
 const visits=data.orders.filter(o=>o.customerId===customerId).slice().reverse();
 const appts=data.appointments.filter(a=>a.customerId===customerId).slice().reverse();
 const packageRows=data.packages.filter(p=>p.customerId===customerId);
 openModal(c.name,`<div class="form">
   <div class="card" style="padding:14px">
    <b>旧配套 / Opening Balance</b>
    <div class="muted" style="margin:5px 0 10px">把 App 上线前购买、现在还剩的次数或 Value 直接录入。</div>
    <button type="button" class="btn" onclick="openHistoricalPackage('${customerId}')">＋ 添加旧配套 / Opening Balance</button>
   </div>
   <div class="summary">
    <div><span>Customer ID</span><b>${c.id}</b></div>
    <div><span>Phone</span><b>${c.phone||'—'}</b></div>
    <div><span>Birthday</span><b>${c.birthday||'—'}</b></div>
   </div>
   <div class="field"><label>Customer Remark</label><textarea id="editCustomerRemark">${c.remark||''}</textarea></div>
   <button class="btn dark" onclick="saveCustomerRemark('${c.id}')">Save Customer Info</button>
   <div class="section"><b>Visit History & Remarks</b>${visits.length?visits.map(o=>`<div class="row"><div><b>${o.date} · ${o.service}</b><div class="muted">${o.billing} · ${o.staff} · ${money(o.amount)}</div>${o.remark?`<div style="margin-top:5px">${o.remark}</div>`:'<div class="muted" style="margin-top:5px">No visit remark</div>'}</div></div>`).join(''):'<div class="empty">No visit records yet.</div>'}</div>
   <div class="section"><b>Package Balance</b>${packageRows.length?packageRows.map(p=>p.packageType==='value'?`<div class="row"><div><b>Value 配套 · Any Service</b><div class="muted">Total PKG Value ${money(p.totalValue||0)} · 已使用 ${money((p.totalValue||0)-(p.valueBalance||0))} · ${p.source==='historical'?'Opening Balance':''}</div></div><b>Balance ${money(p.valueBalance||0)}</b></div>`:`<div class="row"><div><b>${p.service}</b><div class="muted">${p.times} purchased · ${p.used} used · ${p.source==='historical'?'Opening Balance':''}</div></div><b>Balance ${Math.max(0,p.times-p.used)} 次</b></div>`).join(''):'<div class="empty">No packages.</div>'}</div>
   <div class="section"><b>Appointments</b>${appts.length?appts.map(a=>`<div class="row"><div><b>${a.date} · ${a.time}</b><div class="muted">${a.service} · ${a.staff}</div></div><span class="pill">${a.status}</span></div>`).join(''):'<div class="empty">No appointments.</div>'}</div>
 </div>`);
}
function saveCustomerRemark(customerId){
 const c=data.customers.find(x=>x.id===customerId);
 if(!c)return;
 c.remark=document.getElementById('editCustomerRemark')?.value.trim()||'';
 save().then(()=>{closeModal();render();toast('顾客资料已更新');});
}

function apptStatusLabel(status){
 const map={Booked:'已预约',Confirmed:'已确认',Completed:'已完成',Cancelled:'已取消',Rescheduled:'已改期'};
 return map[status]||status||'已预约';
}
function apptCustomer(a){return data.customers.find(x=>x.id===a.customerId)?.name||'—'}
function apptChip(a){
 return `<button class="appt-chip ${a.status==='Cancelled'?'cancelled':''}" onclick="openAppointmentEdit('${a.id}')"><b>${a.time}</b> ${apptCustomer(a)}<small>${a.service} · ${a.status==='Cancelled'?'已取消':a.staff}</small></button>`;
}
function appointmentMonthView(year,month){
 const first=new Date(Date.UTC(year,month,1)), last=new Date(Date.UTC(year,month+1,0));
 const start=first.getUTCDay(), days=last.getUTCDate();
 const cells=[];
 for(let i=0;i<start;i++)cells.push(`<div class="cal-cell muted-cell"></div>`);
 for(let d=1;d<=days;d++){
   const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
   const list=data.appointments.filter(a=>a.date===ds).sort((a,b)=>a.time.localeCompare(b.time));
   const today=ds===new Date().toISOString().slice(0,10);
   cells.push(`<div class="cal-cell ${today?'today':''}"><div class="cal-date">${d}</div>${list.slice(0,4).map(apptChip).join('')}${list.length>4?`<div class="more">+${list.length-4} more</div>`:''}</div>`);
 }
 return `<div class="calendar">${cells.join('')}</div>`;
}
function appointmentDayView(date){
 const times=[];
 for(let h=9;h<=21;h++) times.push(`${String(h).padStart(2,'0')}:00`);
 const rows=times.map(t=>{
   const staffCells=STAFF.map(st=>{
     const ap=data.appointments.filter(a=>a.date===date&&a.staff===st&&String(a.time||'').slice(0,2)===t.slice(0,2)).sort((x,y)=>x.time.localeCompare(y.time));
     return `<div class="slot">${ap.map(apptChip).join('')}${!ap.length?'<span class="slot-empty">—</span>':''}</div>`;
   }).join('');
   return `<div class="time-row"><div class="time-label">${t}</div>${staffCells}</div>`;
 }).join('');
 return `<div class="schedule-scroll"><div class="schedule-grid"><div class="time-head"></div>${STAFF.map(s=>`<div class="staff-head">${s}</div>`).join('')}${rows}</div></div>`;
}
function appointmentsView(){
 const now=new Date(), defaultDate=now.toISOString().slice(0,10);
 const parts=defaultDate.split('-').map(Number);
 const y=Number(window.apptYear||parts[0]), m=Number.isInteger(window.apptMonth)?window.apptMonth:parts[1]-1;
 const selected=window.apptDate||defaultDate;
 return `<div class="toolbar appt-toolbar">
   <button class="btn dark" onclick="openAppointment()">＋ New Appointment</button>
   <div class="view-switch">
    <button class="btn ${window.apptView!=='day'?'dark':''}" onclick="setApptView('month')">Month</button>
    <button class="btn ${window.apptView==='day'?'dark':''}" onclick="setApptView('day')">Day</button>
   </div>
   ${window.apptView==='day'?`<input class="date-control" type="date" value="${selected}" onchange="selectApptDate(this.value)">`:''}
 </div>
 <div class="card">
  ${window.apptView==='day'
   ? `<div class="section-head"><div><b>${selected}</b><div class="muted">每日预约 · 点击预约可改时间、员工或取消</div></div></div>${appointmentDayView(selected)}`
   : `<div class="calendar-head"><button class="btn" onclick="changeApptMonth(-1)">‹</button><b>${y}年 ${m+1}月</b><button class="btn" onclick="changeApptMonth(1)">›</button></div><div class="weekdays">${['日','一','二','三','四','五','六'].map(x=>`<b>${x}</b>`).join('')}</div>${appointmentMonthView(y,m)}`
  }
 </div>
 <div class="card section">
  <div class="section-head"><b>预约状态</b><span class="muted">点击任何预约可修改</span></div>
  <div class="status-legend"><span>● 已预约</span><span>● 已确认</span><span>● 已完成</span><span>● 已改期</span><span>● 已取消</span></div>
 </div>`;
}
function setApptView(v){window.apptView=v;render()}
function changeApptMonth(delta){
 const base=new Date(Date.UTC(Number(window.apptYear||new Date().getFullYear()),Number.isInteger(window.apptMonth)?window.apptMonth:new Date().getMonth(),1));
 base.setUTCMonth(base.getUTCMonth()+delta);
 window.apptYear=base.getUTCFullYear();window.apptMonth=base.getUTCMonth();render();
}
function selectApptDate(v){window.apptDate=v;const [y,m]=v.split('-').map(Number);window.apptYear=y;window.apptMonth=m-1;render()}
function openAppointmentEdit(id){
 const a=data.appointments.find(x=>x.id===id); if(!a)return;
 const customer=apptCustomer(a);

function appointmentConflict(date,time,staff,excludeId=''){

}
function conflictMessage(conflict){

 return `⚠️ 预约冲突\n\n${conflict.staff} 在 ${conflict.date} ${conflict.time} 已有预约：\n${name} · ${conflict.service}\n\n请换时间或换员工。`;
}

function saveHistoricalPackage(e,customerId){
 e.preventDefault();
 const c=data.customers.find(x=>x.id===customerId);
 if(!c)return;
 const type=document.getElementById('hType').value;
 const date=document.getElementById('hDate').value||new Date().toISOString().slice(0,10);
 const price=Number(document.getElementById('hPrice').value||0);
 const remark=document.getElementById('hRemark').value.trim();

 if(type==='times'){
   const times=Math.max(1,Number(document.getElementById('hTimes').value||0));
   const remaining=Math.max(0,Math.min(times,Number(document.getElementById('hRemaining').value||0)));
   const service=document.getElementById('hService').value;
   if(!service)return toast('请选择项目');
   data.packages.push({
     id:'P'+Date.now(),customerId,customerName:c.name,service,
     times,used:times-remaining,price,originalTotal:price,
     packageType:'times',source:'historical',purchasedAt:date,remark
   });
 }else{
   const buy=Number(document.getElementById('hBuyValue').value||0);
   const bonus=Number(document.getElementById('hBonusValue').value||0);
   const enteredTotal=Number(document.getElementById('hTotalValue').value||0);
   const total=enteredTotal>0?enteredTotal:buy+bonus;
   const balance=Math.max(0,Math.min(total,Number(document.getElementById('hBalanceValue').value||0)));
   if(total<=0)return toast('请输入 Total PKG Value');
   data.packages.push({
     id:'P'+Date.now(),customerId,customerName:c.name,service:'Any Service',
     times:0,used:0,price,originalTotal:0,
     packageType:'value',source:'historical',purchasedAt:date,remark,
     buyValue:buy,bonusValue:bonus,totalValue:total,valueBalance:balance
   });
 }
 save().then(()=>{closeModal();render();toast('旧配套余额已加入，不计入营业额');});
}

function completeOrder(e){
 e.preventDefault();
 const customer=data.customers.find(c=>c.id===oCustomer.value), s=service(oService.value), b=billingType();
 if(!customer)return toast('请选择顾客');
 let amount=0, packageId=null, timesPurchased=0;
 if(b==='single')amount=s.price;
 if(b==='package_buy'){
   const pType=document.getElementById('pType')?.value||'times';
   amount=Number(document.getElementById('pPrice').value||0);
   if(amount<0)return toast('配套售价不能为负数');
   if(!amount&&!confirm('配套售价是 RM0，要继续吗？'))return;
   if(pType==='value'){
     const buyValue=Number(document.getElementById('pValue').value||0), bonusValue=Number(document.getElementById('pBonusValue').value||0);
     const entered=Number(document.getElementById('pTotalValue').value||0), totalValue=entered||buyValue+bonusValue;
     if(totalValue<=0)return toast('请输入 Total PKG Value');
     const p={id:'P'+Date.now(),customerId:customer.id,customerName:customer.name,service:s.name,times:0,used:0,price:amount,originalTotal:0,packageType:'value',buyValue,bonusValue,totalValue,valueBalance:totalValue,purchasedAt:new Date().toISOString()};
     data.packages.push(p);packageId=p.id;
   }else{
     timesPurchased=Math.max(1,Number(document.getElementById('pTimes').value||0));
     const p={id:'P'+Date.now(),customerId:customer.id,customerName:customer.name,service:s.name,times:timesPurchased,used:0,price:amount,originalTotal:s.price*timesPurchased,packageType:'times',purchasedAt:new Date().toISOString()};
     data.packages.push(p);packageId=p.id;
   }
 }
 if(b==='package_use'){
   const valuePkgs=data.packages.filter(x=>x.customerId===customer.id&&x.packageType==='value'&&Number(x.valueBalance||0)>0);
   const timesPkg=data.packages.find(x=>x.customerId===customer.id&&x.packageType!=='value'&&x.service===s.name&&(x.times-x.used)>0);
   const selected=document.getElementById('usePackageType')?.value||(timesPkg?'times':'value');
   if(selected==='times'){
     if(!timesPkg)return toast('该项目没有可使用的次数配套');
     amount=0; timesPkg.used+=1; packageId=timesPkg.id;
     data.usage.push({id:'U'+Date.now(),date:new Date().toISOString().slice(0,10),customerId:customer.id,customerName:customer.name,service:s.name,packageId,used:1,usedValue:0,staff:oStaff.value});
   }else{
     const useValue=Math.max(0,Number(document.getElementById('useValue')?.value||0));
     const valuePkg=valuePkgs.find(x=>Number(x.valueBalance||0)>=useValue);
     if(!valuePkg||useValue<=0)return toast('请输入有效的 Value 使用金额，并确认余额足够');
     amount=0; valuePkg.valueBalance=Number(valuePkg.valueBalance||0)-useValue; packageId=valuePkg.id;
     data.usage.push({id:'U'+Date.now(),date:new Date().toISOString().slice(0,10),customerId:customer.id,customerName:customer.name,service:s.name,packageId,used:1,usedValue:useValue,staff:oStaff.value});
   }
 }
 data.orders.push({id:'O'+Date.now(),date:new Date().toISOString().slice(0,10),customerId:customer.id,customerName:customer.name,service:s.name,billing:b==='single'?'单次使用':b==='package_buy'?'购买配套':'使用配套',amount,payment:oPayment.value,staff:oStaff.value,packageId,remark:oRemark.value});
 save().then(()=>{closeModal();render();toast(b==='package_buy'?'配套购买成功':b==='package_use'?'配套使用成功':'订单保存成功');});
}
async function resetData(){
  if(confirm('确定清除数据库里的全部 V9 Demo 数据？')){
    const r=await fetch(API,{method:'DELETE'});
    if(!r.ok){alert('清除失败');return;}
    location.reload();
  }
}
data.packages.forEach(p=>{if(!p.packageType)p.packageType='times';});
const savedUser=JSON.parse(sessionStorage.getItem('beyoutiful_user')||'null');
if(savedUser&&ACCOUNTS[savedUser.key]&&ACCOUNTS[savedUser.key].role===savedUser.role){currentUser=savedUser;document.getElementById('loginScreen').style.display='none';}
(async()=>{
  try{
    await loadData();
    applyPermissions();renderNav();render();
  }catch(err){
    console.error(err);
    document.getElementById('loginError').textContent='数据库连接失败，请检查 Vercel DATABASE_URL / API';
    document.getElementById('loginError').style.display='block';
  }
})();
</script>
