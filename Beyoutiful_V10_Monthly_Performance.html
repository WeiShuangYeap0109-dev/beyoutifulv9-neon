<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#171717">
<title>Beyoutiful Studio — Management V10</title>
<style>
:root{--bg:#f4f2ef;--card:#fff;--ink:#171717;--muted:#77736d;--line:#e6e1da;--dark:#171717;--ok:#55745c;--danger:#9a514b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:240px;background:#171717;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;letter-spacing:1.5px;font-size:18px}.sub{font-size:10px;color:#aaa;margin-top:4px;letter-spacing:1.8px}.nav{margin-top:34px;display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:12px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#2b2b2b;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:28px;font-weight:750}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px}.btn.dark{background:#171717;color:#fff;border-color:#171717}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat{font-size:28px;font-weight:750;margin-top:8px}.section{margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;font-size:11px}.pill.ok{background:#e6eee8;color:var(--ok)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-weight:600}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modalbox{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.form{display:grid;gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:80px;resize:vertical}.billing{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.billing label{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px}.billing input{display:none}.billing label:has(input:checked){border-color:#171717;background:#f5f3ef}.summary{background:#f6f4f1;border-radius:12px;padding:14px}.summary div{display:flex;justify-content:space-between;padding:4px 0}.order-service-box{border:1px solid var(--line);border-radius:14px;padding:14px;background:#faf9f7}.order-service-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.order-service-title{font-weight:700;font-size:13px}.order-service-remove{border:0;background:transparent;color:var(--danger);font-size:12px;padding:4px 6px}.add-service-btn{width:100%;border:1px dashed #bbb4aa;background:#fff;color:#555;border-radius:12px;padding:11px}.service-total{background:#171717;color:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}.service-total b{font-size:18px}.final-total{background:#171717;color:#fff;border-radius:12px;padding:14px}.final-total div{display:flex;justify-content:space-between;padding:3px 0}.final-total .grand{font-size:18px;font-weight:750;padding-top:8px;margin-top:5px;border-top:1px solid #555}.customer-search{position:relative}.customer-results{position:absolute;z-index:10;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:220px;overflow:auto;box-shadow:0 12px 30px #0002}.customer-result{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:11px}.customer-result:hover{background:#f6f4f1}.selected-customer{background:#f6f4f1;border-radius:10px;padding:10px;margin-top:6px}.calendar-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal-cell{min-height:125px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;overflow:hidden}.cal-cell.today{outline:2px solid #171717}.muted-cell{background:#faf9f7}.cal-date{font-weight:700;font-size:13px;margin-bottom:5px}.appt-chip{display:block;width:100%;border:1px solid #ddd7cf;background:#f6f4f1;border-radius:8px;text-align:left;padding:5px 6px;margin:4px 0;font-size:11px;line-height:1.2;overflow:hidden}.appt-chip b{font-size:11px}.appt-chip small{display:block;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appt-chip.cancelled{opacity:.5;text-decoration:line-through}.more{font-size:10px;color:var(--muted);padding-top:3px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.schedule-scroll{overflow:auto}.schedule-grid{display:grid;grid-template-columns:62px repeat(3,minmax(170px,1fr));min-width:600px;border-top:1px solid var(--line)}.time-head{border-right:1px solid var(--line)}.staff-head{padding:11px;text-align:center;font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#f7f5f2}.time-row{display:contents}.time-label{padding:12px 6px;color:var(--muted);font-size:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.slot{min-height:76px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.slot-empty{color:#ddd;font-size:11px}.status-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.month-select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-width:170px}.login-screen{position:fixed;inset:0;background:#f4f2ef;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.login-card{width:min(420px,100%);background:#fff;border:1px solid #e6e1da;border-radius:20px;padding:28px;box-shadow:0 18px 60px #0001}.login-brand{font-weight:800;letter-spacing:2px;font-size:22px}.login-sub{font-size:10px;color:#77736d;letter-spacing:2px;margin-top:5px}.login-title{font-size:24px;font-weight:750;margin:28px 0 18px}.login-error{color:#9a514b;background:#f4e5e3;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px;display:none}.logout-btn{margin-left:8px}.mobileNav{display:none}@media(max-width:800px){.side{display:none}.main{margin-left:0;width:100%;padding:18px;padding-bottom:80px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.mobileNav{display:flex;position:fixed;z-index:4;bottom:0;left:0;right:0;background:#171717;padding:8px;justify-content:space-around}.mobileNav button{background:none;border:0;color:#aaa;font-size:11px}.mobileNav button.active{color:#fff}.title{font-size:23px}.table{min-width:850px}.scroll{overflow:auto}.billing{grid-template-columns:1fr}.calendar{min-width:720px}.cal-cell{min-height:110px}.schedule-grid{grid-template-columns:54px repeat(3,160px)}.view-switch{margin-left:0}}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen"><div class="login-card"><div class="login-brand">BEYOUTIFUL</div><div class="login-sub">STUDIO & ACADEMY</div><div class="login-title">Management Login</div><div class="login-error" id="loginError">账号或密码不正确</div><form class="form" onsubmit="doLogin(event)"><div class="field"><label>Account</label><select id="loginAccount"><option value="belle">Belle</option><option value="jieyun">Jie Yun</option><option value="kelly">Kelly</option></select></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="btn dark">Login</button></form><div class="muted" style="margin-top:14px">V10 Management</div></div></div>
<div class="app"><aside class="side"><div class="brand">BEYOUTIFUL</div><div class="sub">STUDIO & ACADEMY</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Home</div><div class="muted" id="welcome">Beyoutiful Studio Management</div></div><div><button class="btn dark" onclick="openOrder()">＋ New Order</button><button class="btn logout-btn" onclick="logout()">Logout</button></div></div><div id="view"></div></main><div class="mobileNav" id="mobileNav"></div></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle" style="margin:0"></h3><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const API='/api/data';
const ACCOUNTS={belle:{name:'Belle',role:'owner',password:'Belle2026!'},jieyun:{name:'Jie Yun',role:'staff',password:'Jieyun2026!'},kelly:{name:'Kelly',role:'staff',password:'Kelly2026!'}};
const SERVICES=[{name:'深层清洁护理',price:128,duration:120},{name:'Lash Lift',price:158,duration:90},{name:'REJUVENATION 焕肤护理',price:238,duration:90},{name:'美甲',price:88,duration:90},{name:'嫁接睫毛',price:128,duration:120},{name:'野生眉',price:168,duration:90},{name:'纹绣补色',price:199,duration:120}];
const STAFF=['Belle','Jieyun','Kelly'];let currentUser=null,page='home',syncing=false,orderServiceCount=1,data={customers:[],appointments:[],orders:[],packages:[],usage:[],nextCustomer:1};
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return 'RM '+Number(n||0).toFixed(2)}function localDate(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function minutes(t){const [h,m]=String(t||'').split(':').map(Number);return Number.isFinite(h)&&Number.isFinite(m)?h*60+m:null}function calcEndTime(start,duration){const s=minutes(start);if(s===null)return '';const t=s+Number(duration||0);return `${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}function service(n){return SERVICES.find(s=>s.name===n)||{name:n,price:0,duration:90}}function toast(m){alert(m)}
async function loadData(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('Database API error '+r.status);data=await r.json();for(const k of ['customers','appointments','orders','packages','usage'])if(!Array.isArray(data[k]))data[k]=[];data.nextCustomer=Number(data.nextCustomer||1);data.customers.forEach(c=>{c.birthday??='';c.remark??=''});data.appointments.forEach(a=>{a.endTime??=calcEndTime(a.time,service(a.service).duration||90);a.remark??=''});data.orders.forEach(o=>{o.discount=Number(o.discount||0);o.originalAmount=o.originalAmount===undefined?Number(o.amount||0)+o.discount:Number(o.originalAmount||0)})}
async function save(){if(syncing)return;syncing=true;try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Database save failed '+r.status)}finally{syncing=false}}
function navItems(){const x=[['home','Home'],['customers','Customers'],['appointments','Appointments'],['orders','Orders'],['packages','Package Balance'],['performance','My Performance']];if(currentUser?.role==='owner')x.push(['finance','Sales'],['settings','Settings']);return x}function renderNav(){const h=navItems().map(([k,l])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');$('nav').innerHTML=h;$('mobileNav').innerHTML=h}function applyPermissions(){if(currentUser)$('welcome').textContent=`${currentUser.name} · ${currentUser.role==='owner'?'Owner':'Staff'}`}function go(p){page=p;$('pageTitle').textContent=navItems().find(x=>x[0]===p)?.[1]||'Home';render()}function render(){if(!currentUser)page='home';if(!navItems().some(x=>x[0]===page))page='home';renderNav();const v=$('view');v.innerHTML=page==='home'?homeView():page==='customers'?customersView():page==='appointments'?appointmentsView():page==='orders'?ordersView():page==='packages'?packagesView():page==='performance'?performanceView():page==='finance'?financeView():settingsView()}
function doLogin(e){e.preventDefault();const k=$('loginAccount').value,a=ACCOUNTS[k],err=$('loginError');if(!a||$('loginPassword').value!==a.password){err.style.display='block';return}currentUser={key:k,name:a.name,role:a.role};sessionStorage.setItem('beyoutiful_user',JSON.stringify(currentUser));$('loginScreen').style.display='none';err.style.display='none';applyPermissions();render()}function logout(){sessionStorage.removeItem('beyoutiful_user');currentUser=null;$('loginScreen').style.display='flex'}
function monthKey(date){return String(date||'').slice(0,7)}function currentMonthKey(){return localDate().slice(0,7)}function monthLabel(key){const [y,m]=String(key||currentMonthKey()).split('-').map(Number);if(!y||!m)return key;return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}function monthOptions(){const keys=new Set(data.orders.map(o=>monthKey(o.date)).filter(Boolean));keys.add(currentMonthKey());return Array.from(keys).sort().reverse()}function ordersForMonth(key){return data.orders.filter(o=>monthKey(o.date)===key)}function homeView(){const month=currentMonthKey(),monthOrders=ordersForMonth(month),rev=monthOrders.reduce((a,o)=>a+Number(o.amount||0),0),today=localDate(),ap=data.appointments.filter(a=>a.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="section-head"><div><h3 style="margin:0">This Month</h3><div class="muted">${esc(monthLabel(month))}</div></div></div><div class="grid stats"><div class="card"><div class="muted">Revenue</div><div class="stat">${money(rev)}</div></div><div class="card"><div class="muted">Completed Orders</div><div class="stat">${monthOrders.length}</div></div><div class="card"><div class="muted">Customers</div><div class="stat">${data.customers.length}</div></div><div class="card"><div class="muted">Appointments This Month</div><div class="stat">${data.appointments.filter(a=>monthKey(a.date)===month).length}</div></div></div><div class="card section"><b>Today</b>${ap.length?ap.map(a=>`<div class="row"><div><b>${esc(a.time)}–${esc(a.endTime||'')} · ${esc(apptCustomer(a))}</b><div class="muted">${esc(a.service)} · ${esc(a.staff)}</div></div><span class="pill ${a.status==='Completed'?'ok':''}">${apptStatusLabel(a.status)}</span></div>`).join(''):'<div class="empty">No appointments today.</div>'}</div>`}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
/* CUSTOMERS */
function customersView(){return `<div class="toolbar"><button class="btn dark" onclick="openCustomer()">＋ New Customer</button></div><div class="card"><div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Birthday</th><th>Remark</th><th>旧配套</th></tr></thead><tbody>${data.customers.map(c=>`<tr onclick="openCustomerDetail('${esc(c.id)}')" style="cursor:pointer"><td>${esc(c.id)}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${esc(c.birthday||'—')}</td><td>${esc(c.remark||'—')}</td><td><button class="btn" onclick="event.stopPropagation();openHistoricalPackage('${esc(c.id)}')">＋ 添加</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No customers</td></tr>'}</tbody></table></div></div>`}
function openCustomer(){openModal('New Customer',`<form class="form" onsubmit="addCustomer(event)"><div class="field"><label>Name *</label><input id="cName" required></div><div class="two"><div class="field"><label>Phone</label><input id="cPhone"></div><div class="field"><label>Birthday</label><input id="cBirthday" type="date"></div></div><div class="field"><label>Customer Remark</label><textarea id="cRemark"></textarea></div><button class="btn dark">Save Customer</button></form>`)}
function openCustomerEdit(id){const c=data.customers.find(x=>x.id===id);if(!c)return;openModal('Edit Customer Info',`<form class="form" onsubmit="saveCustomerInfo(event,'${esc(id)}')"><div class="summary"><div><span>Customer ID</span><b>${esc(c.id)}</b></div></div><div class="field"><label>Name *</label><input id="ecName" required value="${esc(c.name)}"></div><div class="field"><label>Phone</label><input id="ecPhone" value="${esc(c.phone||'')}"></div><div class="field"><label>Birthday</label><input id="ecBirthday" type="date" value="${esc(c.birthday||'')}"></div><div class="field"><label>Customer Remark</label><textarea id="ecRemark">${esc(c.remark||'')}</textarea></div><button class="btn dark">Save Customer Info</button></form>`)}
async function saveCustomerInfo(e,id){e.preventDefault();const c=data.customers.find(x=>x.id===id);if(!c)return;c.name=$('ecName').value.trim();c.phone=$('ecPhone').value.trim();c.birthday=$('ecBirthday').value;c.remark=$('ecRemark').value.trim();await save();closeModal();render();toast('顾客资料已更新')}
function openCustomerDetail(id){const c=data.customers.find(x=>x.id===id);if(!c)return;const visits=data.orders.filter(o=>o.customerId===id).slice().reverse(),appts=data.appointments.filter(a=>a.customerId===id).slice().reverse(),ps=data.packages.filter(p=>p.customerId===id);openModal(c.name,`<div class="form"><div class="card" style="padding:14px"><b>顾客资料 / Customer Info</b><div class="muted" style="margin:5px 0 10px">可以修改姓名、电话号码、生日和备注。</div><button type="button" class="btn dark" onclick="openCustomerEdit('${esc(id)}')">✎ Edit Customer Info</button></div><div class="card" style="padding:14px"><b>旧配套 / Opening Balance</b><div class="muted" style="margin:5px 0 10px">App 上线前购买、现在还剩的余额可以直接录入。</div><button type="button" class="btn" onclick="openHistoricalPackage('${esc(id)}')">＋ 添加旧配套</button></div><div class="summary"><div><span>Customer ID</span><b>${esc(c.id)}</b></div><div><span>Name</span><b>${esc(c.name)}</b></div><div><span>Phone</span><b>${esc(c.phone||'—')}</b></div><div><span>Birthday</span><b>${esc(c.birthday||'—')}</b></div><div><span>Remark</span><b>${esc(c.remark||'—')}</b></div></div><div class="section"><b>Visit History & Remarks</b>${visits.length?visits.map(o=>`<div class="row"><div><b>${esc(o.date)} · ${esc(o.service||'')}</b><div class="muted">${esc(o.billing)} · ${money(o.amount)}</div>${Number(o.discount||0)>0?`<div class="muted">Original ${money(o.originalAmount)} · Discount ${money(o.discount)}</div>`:''}<div style="margin-top:5px">${esc(o.remark||'No visit remark')}</div></div></div>`).join(''):'<div class="empty">No visit records yet.</div>'}</div><div class="section"><b>Package Balance</b>${ps.length?ps.map(p=>p.packageType==='value'?`<div class="row"><div><b>Value 配套 · Any Service</b><div class="muted">Total ${money(p.totalValue||0)} · Used ${money((p.totalValue||0)-(p.valueBalance||0))}</div></div><b>Balance ${money(p.valueBalance||0)}</b></div>`:`<div class="row"><div><b>${esc(p.service)}</b><div class="muted">${p.times} purchased · ${p.used} used</div></div><b>Balance ${Math.max(0,p.times-p.used)} 次</b></div>`).join(''):'<div class="empty">No packages.</div>'}</div><div class="section"><b>Appointments</b>${appts.length?appts.map(a=>`<div class="row"><div><b>${esc(a.date)} · ${esc(a.time)}–${esc(a.endTime||'')}</b><div class="muted">${esc(a.service)} · ${esc(a.staff)}</div></div><span class="pill">${apptStatusLabel(a.status)}</span></div>`).join(''):'<div class="empty">No appointments.</div>'}</div>${currentUser?.role==='owner'?`<button class="btn danger" onclick="deleteCustomer('${esc(id)}')">🗑️ 删除这个顾客</button>`:''}</div>`)}
function addCustomer(e){e.preventDefault();data.customers.push({id:'C'+String(data.nextCustomer++).padStart(3,'0'),name:$('cName').value.trim(),phone:$('cPhone').value.trim(),birthday:$('cBirthday').value,remark:$('cRemark').value.trim()});save().then(()=>{closeModal();render();toast('顾客已加入')})}
async function deleteCustomer(id){if(currentUser?.role!=='owner')return toast('只有 Owner 可以删除顾客');const c=data.customers.find(x=>x.id===id);if(!c||!confirm(`确定要删除顾客「${c.name}」吗？\n\n顾客资料、预约、订单、配套余额及使用记录都会一起删除。\n\n这个操作不能恢复。`))return;data.customers=data.customers.filter(x=>x.id!==id);data.appointments=data.appointments.filter(x=>x.customerId!==id);data.orders=data.orders.filter(x=>x.customerId!==id);data.packages=data.packages.filter(x=>x.customerId!==id);data.usage=data.usage.filter(x=>x.customerId!==id);try{await save();closeModal();render();toast('顾客已删除')}catch(e){alert('删除失败，请检查数据库连接。')}}
/* APPOINTMENTS */
function apptStatusLabel(s){return ({Booked:'已预约',Confirmed:'已确认',Completed:'已完成',Cancelled:'已取消',Rescheduled:'已改期'})[s]||s||'已预约'}function apptCustomer(a){return data.customers.find(c=>c.id===a.customerId)?.name||'—'}function apptPhone(a){return data.customers.find(c=>c.id===a.customerId)?.phone||''}
function appointmentConflict(date,start,end,staff,exclude=''){const s=minutes(start),e=minutes(end);if(s===null||e===null||e<=s)return null;return data.appointments.find(a=>a.id!==exclude&&a.date===date&&a.staff===staff&&a.status!=='Cancelled'&&s<minutes(a.endTime||calcEndTime(a.time,service(a.service).duration||90))&&e>minutes(a.time))}function conflictMessage(a){return `⚠️ 预约冲突\n\n${a.staff} 在 ${a.date} ${a.time}–${a.endTime||''} 已有预约：\n\n${apptCustomer(a)} · ${a.service}\n\n请换时间或换员工。`}
function apptChip(a){return `<button class="appt-chip ${a.status==='Cancelled'?'cancelled':''}" onclick="openAppointmentEdit('${esc(a.id)}')"><b>${esc(a.time)}–${esc(a.endTime||'')}</b> ${esc(apptCustomer(a))}<small>${esc(apptPhone(a))} · ${esc(a.service)} · ${a.status==='Cancelled'?'已取消':esc(a.staff)}</small></button>`}
function appointmentMonthView(y,m){const first=new Date(Date.UTC(y,m,1)),last=new Date(Date.UTC(y,m+1,0)),start=first.getUTCDay(),cells=[];for(let i=0;i<start;i++)cells.push('<div class="cal-cell muted-cell"></div>');for(let d=1;d<=last.getUTCDate();d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,list=data.appointments.filter(a=>a.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));cells.push(`<div class="cal-cell ${ds===localDate()?'today':''}"><div class="cal-date">${d}</div>${list.slice(0,4).map(apptChip).join('')}${list.length>4?`<div class="more">+${list.length-4} more</div>`:''}</div>`)}return `<div class="calendar">${cells.join('')}</div>`}
function appointmentDayView(date){const times=[];for(let h=9;h<=21;h++)times.push(`${String(h).padStart(2,'0')}:00`);return `<div class="schedule-scroll"><div class="schedule-grid"><div class="time-head"></div>${STAFF.map(s=>`<div class="staff-head">${s}</div>`).join('')}${times.map(t=>`<div class="time-row"><div class="time-label">${t}</div>${STAFF.map(st=>{const ap=data.appointments.filter(a=>a.date===date&&a.staff===st&&a.status!=='Cancelled'&&minutes(a.time)>=minutes(t)&&minutes(a.time)<minutes(t)+60);return `<div class="slot">${ap.map(apptChip).join('')}${!ap.length?'<span class="slot-empty">—</span>':''}</div>`}).join('')}</div>`).join('')}</div></div>`}
function appointmentsView(){const d=localDate(),p=d.split('-').map(Number),y=Number(window.apptYear||p[0]),m=Number.isInteger(window.apptMonth)?window.apptMonth:p[1]-1,selected=window.apptDate||d;return `<div class="toolbar"><button class="btn dark" onclick="openAppointment()">＋ New Appointment</button><div class="view-switch"><button class="btn ${window.apptView!=='day'?'dark':''}" onclick="setApptView('month')">Month</button><button class="btn ${window.apptView==='day'?'dark':''}" onclick="setApptView('day')">Day</button></div>${window.apptView==='day'?`<input class="btn" type="date" value="${selected}" onchange="selectApptDate(this.value)">`:''}</div><div class="card">${window.apptView==='day'?`<div class="section-head"><div><b>${selected}</b><div class="muted">Start Time – End Time · 点击预约可修改</div></div></div>${appointmentDayView(selected)}`:`<div class="calendar-head"><button class="btn" onclick="changeApptMonth(-1)">‹</button><b>${y}年 ${m+1}月</b><button class="btn" onclick="changeApptMonth(1)">›</button></div><div class="weekdays">${['日','一','二','三','四','五','六'].map(x=>`<b>${x}</b>`).join('')}</div>${appointmentMonthView(y,m)}`}</div><div class="card section"><div class="section-head"><b>预约状态</b><span class="muted">点击任何预约可修改</span></div><div class="status-legend"><span>● 已预约</span><span>● 已确认</span><span>● 已完成</span><span>● 已改期</span><span>● 已取消</span></div></div>`}
function setApptView(v){window.apptView=v;render()}function changeApptMonth(n){const d=new Date(Date.UTC(Number(window.apptYear||new Date().getFullYear()),Number.isInteger(window.apptMonth)?window.apptMonth:new Date().getMonth(),1));d.setUTCMonth(d.getUTCMonth()+n);window.apptYear=d.getUTCFullYear();window.apptMonth=d.getUTCMonth();render()}function selectApptDate(v){window.apptDate=v;const [y,m]=v.split('-').map(Number);window.apptYear=+y;window.apptMonth=+m-1;render()}
function customerSearchHTML(prefix,id=''){const c=data.customers.find(x=>x.id===id);return `<div class="field customer-search"><label>Customer（可搜姓名或电话号码）</label><input id="${prefix}CustomerSearch" autocomplete="off" placeholder="输入姓名 / 电话号码" value="${c?esc(c.name):''}" oninput="searchCustomer('${prefix}',this.value)" onfocus="searchCustomer('${prefix}',this.value)"><input type="hidden" id="${prefix}Customer" value="${esc(id)}"><div id="${prefix}CustomerResults" class="customer-results" style="display:none"></div><div id="${prefix}SelectedCustomer" class="selected-customer" style="${c?'':'display:none'}">${c?`<b>${esc(c.name)}</b><div class="muted">📞 ${esc(c.phone||'未填写电话')} · ID ${esc(c.id)}</div>`:''}</div></div>`}
function searchCustomer(prefix,q){const box=$(prefix+'CustomerResults');if(!box)return;const term=String(q||'').trim().toLowerCase();const list=data.customers.filter(c=>!term||String(c.name||'').toLowerCase().includes(term)||String(c.phone||'').toLowerCase().includes(term));box.innerHTML=list.slice(0,30).map(c=>`<button type="button" class="customer-result" onclick="selectCustomer('${prefix}','${esc(c.id)}')"><b>${esc(c.name)}</b><div class="muted">📞 ${esc(c.phone||'未填写电话')} · ID ${esc(c.id)}</div></button>`).join('')||'<div class="empty">找不到顾客</div>';box.style.display='block'}function selectCustomer(prefix,id){const c=data.customers.find(x=>x.id===id);if(!c)return;$(prefix+'Customer').value=id;$(prefix+'CustomerSearch').value=c.name;$(prefix+'SelectedCustomer').style.display='block';$(prefix+'SelectedCustomer').innerHTML=`<b>${esc(c.name)}</b><div class="muted">📞 ${esc(c.phone||'未填写电话')} · ID ${esc(c.id)}</div>`;$(prefix+'CustomerResults').style.display='none';if(prefix==='a')refreshAppointmentEnd();if(prefix==='o')refreshOrder()}document.addEventListener('click',e=>{if(!e.target.closest('.customer-search'))document.querySelectorAll('.customer-results').forEach(x=>x.style.display='none')});
function openAppointment(){openModal('New Appointment',`<form class="form" onsubmit="addAppointment(event)"><div class="two"><div class="field"><label>Date</label><input id="aDate" type="date" required value="${localDate()}"></div><div class="field"><label>Start Time</label><input id="aTime" type="time" required oninput="refreshAppointmentEnd()"></div></div>${customerSearchHTML('a')}<div class="two"><div class="field"><label>Service</label><select id="aService" onchange="refreshAppointmentEnd()">${SERVICES.filter(s=>s.active!==false).map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Staff</label><select id="aStaff">${(currentUser?.role==='staff'?[currentUser.name]:STAFF).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>End Time（自动计算，可修改）</label><input id="aEndTime" type="time" required></div><div class="field"><label>Service Duration</label><input id="aDuration" disabled></div></div><div class="field"><label>预约备注</label><textarea id="aRemark"></textarea></div><button class="btn dark">Save Appointment</button></form>`);refreshAppointmentEnd()}
function refreshAppointmentEnd(){const s=$('aTime'),e=$('aEndTime'),sv=$('aService'),du=$('aDuration');if(!s||!e||!sv)return;const d=service(sv.value).duration||90;if(s.value)e.value=calcEndTime(s.value,d);if(du)du.value=d+' min'}
function openAppointmentEdit(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;const end=a.endTime||calcEndTime(a.time,service(a.service).duration||90),c=data.customers.find(x=>x.id===a.customerId);openModal('预约详情',`<form class="form" id="editApptForm" onsubmit="saveAppointmentEdit(event,'${esc(id)}')"><div class="summary"><div><span>顾客</span><b>${esc(c?.name||'—')}</b></div><div><span>电话</span><b>${esc(c?.phone||'—')}</b></div><div><span>项目</span><b>${esc(a.service)}</b></div></div><div class="two"><div class="field"><label>日期</label><input id="eDate" type="date" required value="${esc(a.date)}"></div><div class="field"><label>Start Time</label><input id="eTime" type="time" required value="${esc(a.time)}"></div></div><div class="two"><div class="field"><label>End Time</label><input id="eEndTime" type="time" required value="${esc(end)}"></div><div class="field"><label>员工</label><select id="eStaff">${(currentUser?.role==='staff'?[currentUser.name]:STAFF).map(s=>`<option ${s===a.staff?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div><div class="field"><label>状态</label><select id="eStatus">${['Booked','Confirmed','Completed','Rescheduled','Cancelled'].map(s=>`<option value="${s}" ${s===a.status?'selected':''}>${apptStatusLabel(s)}</option>`).join('')}</select></div><div class="field"><label>预约备注</label><textarea id="eRemark">${esc(a.remark||'')}</textarea></div><button class="btn dark">保存修改</button><button type="button" class="btn danger" onclick="cancelAppointment('${esc(id)}')">直接取消预约</button></form>`)}
function addAppointment(e){e.preventDefault();const cid=$('aCustomer').value;if(!cid)return toast('请选择顾客');if(minutes($('aEndTime').value)<=minutes($('aTime').value))return toast('End Time 必须晚于 Start Time');const c=appointmentConflict($('aDate').value,$('aTime').value,$('aEndTime').value,$('aStaff').value);if(c)return alert(conflictMessage(c));data.appointments.push({id:'A'+Date.now(),date:$('aDate').value,time:$('aTime').value,endTime:$('aEndTime').value,customerId:cid,service:$('aService').value,staff:$('aStaff').value,status:'Booked',remark:$('aRemark').value.trim()});save().then(()=>{closeModal();window.apptDate=$('aDate').value;render();toast('预约已建立')})}
function saveAppointmentEdit(e,id){e.preventDefault();const a=data.appointments.find(x=>x.id===id);if(!a)return;if(minutes($('eEndTime').value)<=minutes($('eTime').value))return toast('End Time 必须晚于 Start Time');const c=appointmentConflict($('eDate').value,$('eTime').value,$('eEndTime').value,$('eStaff').value,id);if(c&&$('eStatus').value!=='Cancelled')return alert(conflictMessage(c));a.date=$('eDate').value;a.time=$('eTime').value;a.endTime=$('eEndTime').value;a.staff=$('eStaff').value;a.status=$('eStatus').value;a.remark=$('eRemark').value.trim();save().then(()=>{closeModal();window.apptDate=a.date;render();toast(a.status==='Cancelled'?'预约已取消':'预约已更新')})}function cancelAppointment(id){const a=data.appointments.find(x=>x.id===id);if(!a)return;if(confirm('确定取消这个预约吗？')){a.status='Cancelled';a.remark=(a.remark?a.remark+' · ':'')+'顾客取消/预约取消';save().then(()=>{closeModal();render();toast('预约已取消')})}}
/* ORDERS */
function billingType(){return document.querySelector('input[name="billing"]:checked')?.value||'single'}function availableStaffOptions(){return(currentUser?.role==='staff'?[currentUser.name]:STAFF).map(s=>`<option>${esc(s)}</option>`).join('')}function serviceOptionsHTML(){return SERVICES.filter(s=>s.active!==false).map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}function getOrderItems(){const r=[];for(let i=1;i<=orderServiceCount;i++){const s=$('oService'+i),st=$('oStaff'+i);if(s&&st&&s.value)r.push({service:s.value,staff:st.value})}return r}function orderServiceRow(i,rm=false){return `<div class="order-service-box" id="orderServiceBox${i}"><div class="order-service-head"><div class="order-service-title">Service ${i}</div>${rm?`<button type="button" class="order-service-remove" onclick="removeOrderService(${i})">✕ Remove</button>`:''}</div><div class="two"><div class="field"><label>Service</label><select id="oService${i}" onchange="refreshOrder()">${serviceOptionsHTML()}</select></div><div class="field"><label>Serve By</label><select id="oStaff${i}">${availableStaffOptions()}</select></div></div></div>`}
function openOrder(){orderServiceCount=1;openModal('New Order',`<form class="form" onsubmit="completeOrder(event)">${customerSearchHTML('o')}<div id="orderServiceList">${orderServiceRow(1)}</div><button type="button" class="add-service-btn" id="addServiceBtn" onclick="addOrderService()">＋ Add another Service</button><div class="field"><label>Billing</label><div class="billing"><label><input type="radio" name="billing" value="single" checked onchange="refreshOrder()"><span>单次使用</span></label><label><input type="radio" name="billing" value="package_buy" onchange="refreshOrder()"><span>购买配套</span></label><label><input type="radio" name="billing" value="package_use" onchange="refreshOrder()"><span>使用配套</span></label></div></div><div id="orderFields"></div><div class="field"><label>Payment</label><select id="oPayment"><option>Cash</option><option>TNG</option><option>Bank Transfer</option><option>Other</option></select></div><div class="field"><label>本次到店备注</label><textarea id="oRemark"></textarea></div><button class="btn dark" id="orderSubmit">✓ Complete & Save</button></form>`);refreshOrder()}
function addOrderService(){if(orderServiceCount>=2)return toast('一次 Order 最多 2 个 Service');orderServiceCount=2;$('orderServiceList').insertAdjacentHTML('beforeend',orderServiceRow(2,true));$('addServiceBtn').style.display='none';refreshOrder()}function removeOrderService(){if(orderServiceCount!==2)return;$('orderServiceBox2')?.remove();orderServiceCount=1;$('addServiceBtn').style.display='block';refreshOrder()}
function getPackageBalance(cid,sn){return data.packages.filter(p=>p.customerId===cid&&p.packageType!=='value'&&p.service===sn).reduce((n,p)=>n+Math.max(0,Number(p.times||0)-Number(p.used||0)),0)}
function renderOrderTotals(original){const discount=Math.min(original,Math.max(0,Number($('oDiscount')?.value||0))),final=Math.max(0,original-discount);$('orderTotals').innerHTML=`<div class="final-total"><div><span>Original Price</span><b>${money(original)}</b></div><div><span>Discount</span><b>${money(discount)}</b></div><div class="grand"><span>Final Amount</span><b>${money(final)}</b></div></div>`}function refreshOrderTotals(){const o=getOrderItems().reduce((n,i)=>n+Number(service(i.service).price||0),0);if($('orderTotals'))renderOrderTotals(o)}
function refreshOrder(){const f=$('orderFields');if(!f)return;const b=billingType(),items=getOrderItems();if(!items.length)return;if(b==='single'){const original=items.reduce((n,i)=>n+Number(service(i.service).price||0),0);f.innerHTML=`<div class="summary">${items.map(i=>`<div><span>${esc(i.service)}</span><b>${money(service(i.service).price)}</b></div><div><span>Serve By</span><b>${esc(i.staff)}</b></div>`).join('')}</div><div class="field"><label>Discount（折扣，可不填）</label><input id="oDiscount" type="number" min="0" step="0.01" placeholder="没有折扣就留空" oninput="refreshOrderTotals()"></div><div id="orderTotals"></div>`;renderOrderTotals(original);return}if(items.length>1){f.innerHTML='<div class="summary"><div><span>注意</span><b>Package Billing 一次只能选择 1 个 Service</b></div><div class="muted">如果顾客今天做两个不同项目，请选择「单次使用」。</div></div>';$('orderSubmit').disabled=true;return}$('orderSubmit').disabled=false;const item=items[0],s=service(item.service),bal=getPackageBalance($('oCustomer').value,item.service);if(b==='package_buy'){f.innerHTML=`<div class="field"><label>配套类型</label><select id="pType" onchange="refreshPackageSummary()"><option value="times">次数配套</option><option value="value">Value 配套 · Any Service</option></select></div><div class="two"><div class="field"><label>购买次数</label><input id="pTimes" type="number" min="1" value="3" oninput="refreshPackageSummary()"></div><div class="field"><label>配套售价</label><input id="pPrice" type="number" min="0" step="0.01" placeholder="例如 288" oninput="refreshPackageSummary()"></div></div><div id="valueFields" style="display:none"><div class="two"><div class="field"><label>购买 Value</label><input id="pValue" type="number" min="0" step="0.01" oninput="refreshPackageSummary()"></div><div class="field"><label>赠送 Value</label><input id="pBonusValue" type="number" min="0" step="0.01" oninput="refreshPackageSummary()"></div></div><div class="field"><label>Total PKG Value</label><input id="pTotalValue" type="number" min="0" step="0.01" oninput="refreshPackageSummary()"></div></div><div id="packageSummary" class="summary"></div>`;refreshPackageSummary();return}const valuePkgs=data.packages.filter(p=>p.customerId===$('oCustomer').value&&p.packageType==='value'&&Number(p.valueBalance||0)>0),valueBal=valuePkgs.reduce((n,p)=>n+Number(p.valueBalance||0),0),canTimes=bal>0,canValue=valuePkgs.length>0;f.innerHTML=(canTimes&&canValue?'<div class="field"><label>使用配套类型</label><select id="usePackageType" onchange="refreshOrder()"><option value="times">次数配套</option><option value="value">Value 配套</option></select></div>':'')+'<div id="packageUseSummary" class="summary"></div>';const mode=$('usePackageType')?.value||(canTimes?'times':'value');if(mode==='times'&&canTimes)$('packageUseSummary').innerHTML=`<div><span>项目</span><b>${esc(item.service)}</b></div><div><span>Serve By</span><b>${esc(item.staff)}</b></div><div><span>本次使用</span><b>1 次</b></div><div><span>使用后次数余额</span><b>${bal-1} 次</b></div><div><span>本次收费</span><b>RM 0.00</b></div>`;else if(canValue)$('packageUseSummary').innerHTML=`<div><span>项目</span><b>${esc(item.service)}</b></div><div><span>Pkg Value Balance</span><b>${money(valueBal)}</b></div><div class="field"><label>本次使用 Value（自己填写）</label><input id="useValue" type="number" min="0" step="0.01" value="${Number(s.price||0)}" oninput="refreshUseValue()"></div><div id="useValueSummary"><div><span>使用后 Pkg Value</span><b>${money(Math.max(0,valueBal-Number(s.price||0)))}</b></div></div><div><span>本次收费</span><b>RM 0.00</b></div>`;else $('packageUseSummary').innerHTML='<div class="muted">该顾客没有可使用的配套。</div>';$('orderSubmit').disabled=!(canTimes||canValue)}
function refreshUseValue(){const box=$('useValueSummary');if(!box)return;const bal=data.packages.filter(p=>p.customerId===$('oCustomer').value&&p.packageType==='value').reduce((n,p)=>n+Number(p.valueBalance||0),0),v=Math.max(0,Number($('useValue').value||0));box.innerHTML=`<div><span>使用后 Pkg Value</span><b>${money(Math.max(0,bal-v))}</b></div>`}
function refreshPackageSummary(){const i=getOrderItems()[0];if(!i)return;const s=service(i.service),type=$('pType')?.value||'times';$('valueFields').style.display=type==='value'?'block':'none';if(type==='value'){const buy=Number($('pValue')?.value||0),bonus=Number($('pBonusValue')?.value||0),total=Number($('pTotalValue')?.value||0)||buy+bonus;$('packageSummary').innerHTML=`<div><span>适用项目</span><b>Any Service</b></div><div><span>购买 Value</span><b>${money(buy)}</b></div><div><span>赠送 Value</span><b>${money(bonus)}</b></div><div><span>Total PKG Value</span><b>${money(total)}</b></div><div><span>实际售价</span><b>${money($('pPrice').value)}</b></div>`}else{const times=Math.max(1,Number($('pTimes').value||1)),price=Number($('pPrice').value||0);$('packageSummary').innerHTML=`<div><span>项目</span><b>${esc(i.service)}</b></div><div><span>单次原价</span><b>${money(s.price)}</b></div><div><span>原价总额</span><b>${money(s.price*times)}</b></div><div><span>配套售价</span><b>${money(price)}</b></div><div><span>每次实际成本</span><b>${money(price/times)}</b></div>`}}
async function completeOrder(e){e.preventDefault();const customer=data.customers.find(c=>c.id===$('oCustomer').value),b=billingType();if(!customer)return toast('请选择顾客');const items=getOrderItems();if(!items.length)return toast('请选择至少一个 Service');if(b==='single'){const orderItems=items.map(i=>({service:i.service,staff:i.staff,amount:Number(service(i.service).price||0)})),original=orderItems.reduce((n,i)=>n+i.amount,0),discount=Math.min(original,Math.max(0,Number($('oDiscount')?.value||0))),amount=Math.max(0,original-discount);data.orders.push({id:'O'+Date.now(),date:localDate(),customerId:customer.id,customerName:customer.name,service:orderItems.map(i=>i.service).join(' + '),billing:'单次使用',originalAmount:original,discount,amount,payment:$('oPayment').value,staff:orderItems.map(i=>i.staff).join(' + '),items:orderItems,packageId:null,remark:$('oRemark').value.trim()});await save();closeModal();render();toast(`订单保存成功 · Final ${money(amount)}`);return}if(items.length>1)return toast('购买配套 / 使用配套一次只能选择一个 Service');const item=items[0],s=service(item.service);let amount=0,packageId=null;if(b==='package_buy'){const type=$('pType').value;amount=Number($('pPrice').value||0);if(type==='value'){const buy=Number($('pValue').value||0),bonus=Number($('pBonusValue').value||0),total=Number($('pTotalValue').value||0)||buy+bonus;if(total<=0)return toast('请输入 Total PKG Value');const p={id:'P'+Date.now(),customerId:customer.id,customerName:customer.name,service:'Any Service',times:0,used:0,price:amount,originalTotal:0,packageType:'value',buyValue:buy,bonusValue:bonus,totalValue:total,valueBalance:total,purchasedAt:new Date().toISOString(),source:'purchase'};data.packages.push(p);packageId=p.id}else{const times=Math.max(1,Number($('pTimes').value||1));const p={id:'P'+Date.now(),customerId:customer.id,customerName:customer.name,service:item.service,times,used:0,price:amount,originalTotal:s.price*times,packageType:'times',purchasedAt:new Date().toISOString(),source:'purchase'};data.packages.push(p);packageId=p.id}}else{const valuePkgs=data.packages.filter(p=>p.customerId===customer.id&&p.packageType==='value'&&Number(p.valueBalance||0)>0),timesPkg=data.packages.find(p=>p.customerId===customer.id&&p.packageType!=='value'&&p.service===item.service&&Number(p.times||0)-Number(p.used||0)>0),selected=$('usePackageType')?.value||(timesPkg?'times':'value');if(selected==='times'){if(!timesPkg)return toast('该项目没有可使用的次数配套');timesPkg.used++;packageId=timesPkg.id;data.usage.push({id:'U'+Date.now(),date:localDate(),customerId:customer.id,customerName:customer.name,service:item.service,packageId,used:1,usedValue:0,staff:item.staff})}else{const use=Number($('useValue')?.value||0),total=valuePkgs.reduce((n,p)=>n+Number(p.valueBalance||0),0);if(use<=0||use>total)return toast('请输入有效的 Value 使用金额，并确认余额足够');let rem=use;for(const p of valuePkgs){if(rem<=0)break;const d=Math.min(Number(p.valueBalance||0),rem);p.valueBalance-=d;rem-=d;if(d>0)packageId=packageId||p.id}data.usage.push({id:'U'+Date.now(),date:localDate(),customerId:customer.id,customerName:customer.name,service:item.service,packageId,used:1,usedValue:use,staff:item.staff})}}data.orders.push({id:'O'+Date.now(),date:localDate(),customerId:customer.id,customerName:customer.name,service:item.service,billing:b==='package_buy'?'购买配套':'使用配套',originalAmount:amount,discount:0,amount,payment:$('oPayment').value,staff:item.staff,items:[{service:item.service,staff:item.staff,amount}],packageId,remark:$('oRemark').value.trim()});await save();closeModal();render();toast(b==='package_buy'?'配套购买成功':'配套使用成功')}
/* PACKAGES / FINANCE / SETTINGS */
function packagesView(){return `<div class="card"><div class="scroll"><table class="table"><thead><tr><th>Customer</th><th>Package</th><th>Purchased</th><th>Used</th><th>Balance</th><th>Paid</th></tr></thead><tbody>${data.packages.filter(p=>p.packageType==='value'?Number(p.valueBalance||0)>0:p.times-p.used>0).map(p=>p.packageType==='value'?`<tr><td>${esc(p.customerName)}</td><td><b>Value 配套</b></td><td>${money(p.totalValue||0)}</td><td>${money((p.totalValue||0)-(p.valueBalance||0))}</td><td><b>${money(p.valueBalance||0)}</b></td><td>${money(p.price)}</td></tr>`:`<tr><td>${esc(p.customerName)}</td><td>${esc(p.service)}</td><td>${p.times}</td><td>${p.used}</td><td><b>${Math.max(0,p.times-p.used)} 次</b></td><td>${money(p.price)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No active packages</td></tr>'}</tbody></table></div></div>`}
function ordersView(){return `<div class="card"><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Type</th><th>Original</th><th>Discount</th><th>Final</th><th>Staff</th></tr></thead><tbody>${data.orders.slice().reverse().map(o=>{const orig=Number(o.originalAmount??(Number(o.amount||0)+Number(o.discount||0))),disc=Number(o.discount||0),st=Array.isArray(o.items)?o.items.map(i=>i.service).join(' + '):o.service||'',sf=Array.isArray(o.items)?o.items.map(i=>i.staff).join(' + '):o.staff||'';return `<tr><td>${esc(o.date)}</td><td>${esc(o.customerName)}</td><td><b>${esc(st)}</b></td><td>${esc(o.billing)}</td><td>${money(orig)}</td><td>${money(disc)}</td><td><b>${money(o.amount)}</b></td><td>${esc(sf)}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">No orders</td></tr>'}</tbody></table></div></div>`}
function staffAccountName(){return currentUser?.key==='jieyun'?'Jieyun':currentUser?.key==='kelly'?'Kelly':currentUser?.key==='belle'?'Belle':currentUser?.name||''}function staffSalesForMonth(key,staffName){const orders=ordersForMonth(key);let sales=0,services=0,ordersCount=0;for(const o of orders){const items=Array.isArray(o.items)&&o.items.length?o.items:[{service:o.service||'',staff:o.staff||'',amount:Number(o.amount||0)}];const matching=items.filter(i=>String(i.staff||'')===String(staffName));if(!matching.length)continue;services+=matching.length;ordersCount++;const originalItems=items.reduce((n,i)=>n+Number(i.amount||0),0);const finalAmount=Number(o.amount||0);if(originalItems>0){sales+=matching.reduce((n,i)=>n+Number(i.amount||0),0)/originalItems*finalAmount}else{sales+=finalAmount}}return {sales,services,orders:ordersCount,avg:ordersCount?sales/ordersCount:0}}function performanceView(){const key=window.performanceMonth||currentMonthKey(),staffs=currentUser?.role==='owner'?STAFF:[staffAccountName()];return `<div class="section-head"><div><h3 style="margin:0">${currentUser?.role==='owner'?'Staff Performance':'My Performance'}</h3><div class="muted">${currentUser?.role==='owner'?'All staff':'Your personal'} · ${esc(monthLabel(key))}</div></div><select class="month-select" onchange="window.performanceMonth=this.value;render()">${monthOptions().map(k=>`<option value="${k}" ${k===key?'selected':''}>${esc(monthLabel(k))}</option>`).join('')}</select></div><div class="grid stats">${staffs.map(st=>{const x=staffSalesForMonth(key,st);return `<div class="card"><div class="muted">${esc(st)}</div><div class="stat">${money(x.sales)}</div><div class="muted" style="margin-top:7px">${x.orders} orders · ${x.services} services</div><div class="muted">Avg ${money(x.avg)}</div></div>`}).join('')}</div>${currentUser?.role==='owner'?`<div class="card section"><div class="scroll"><table class="table"><thead><tr><th>Staff</th><th>Sales</th><th>Orders</th><th>Services</th><th>Avg Order</th></tr></thead><tbody>${staffs.map(st=>{const x=staffSalesForMonth(key,st);return `<tr><td><b>${esc(st)}</b></td><td><b>${money(x.sales)}</b></td><td>${x.orders}</td><td>${x.services}</td><td>${money(x.avg)}</td></tr>`}).join('')}</tbody></table></div></div>`:''}`}function financeView(){if(currentUser?.role!=='owner')return '<div class="card"><div class="empty">Owner only.</div></div>';const key=window.financeMonth||currentMonthKey(),orders=ordersForMonth(key),total=orders.reduce((n,o)=>n+Number(o.amount||0),0),prevKey=(()=>{const [y,m]=key.split('-').map(Number);const d=new Date(y,m-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`})(),prev=ordersForMonth(prevKey),prevTotal=prev.reduce((n,o)=>n+Number(o.amount||0),0),delta=prevTotal?((total-prevTotal)/prevTotal*100):null;return `<div class="section-head"><div><h3 style="margin:0">Sales Performance</h3><div class="muted">Monthly sales · Owner only</div></div><select class="month-select" onchange="window.financeMonth=this.value;render()">${monthOptions().map(k=>`<option value="${k}" ${k===key?'selected':''}>${esc(monthLabel(k))}</option>`).join('')}</select></div><div class="grid stats"><div class="card"><div class="muted">Total Sales</div><div class="stat">${money(total)}</div></div><div class="card"><div class="muted">Completed Orders</div><div class="stat">${orders.length}</div></div><div class="card"><div class="muted">Previous Month</div><div class="stat">${money(prevTotal)}</div></div><div class="card"><div class="muted">vs Previous Month</div><div class="stat">${delta===null?'—':`${delta>=0?'+':''}${delta.toFixed(1)}%`}</div></div></div><div class="grid stats section">${['Cash','TNG','Bank Transfer','Other'].map(m=>`<div class="card"><div class="muted">${m}</div><div class="stat">${money(orders.filter(o=>o.payment===m).reduce((n,o)=>n+Number(o.amount||0),0))}</div></div>`).join('')}</div><div class="card section"><div class="section-head"><div><b>Monthly Sales</b><div class="muted">${esc(monthLabel(key))}</div></div><b>${money(total)}</b></div><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Staff</th><th>Final</th></tr></thead><tbody>${orders.slice().reverse().map(o=>{const st=Array.isArray(o.items)?o.items.map(i=>i.service).join(' + '):o.service||'',sf=Array.isArray(o.items)?o.items.map(i=>i.staff).join(' + '):o.staff||'';return `<tr><td>${esc(o.date)}</td><td>${esc(o.customerName)}</td><td>${esc(st)}</td><td>${esc(sf)}</td><td><b>${money(o.amount)}</b></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No sales this month.</td></tr>'}</tbody></table></div></div>`}
function saveServices(){localStorage.setItem('beyoutiful_services',JSON.stringify(SERVICES))}function loadServices(){try{const x=JSON.parse(localStorage.getItem('beyoutiful_services')||'null');if(Array.isArray(x)&&x.length)SERVICES.splice(0,SERVICES.length,...x)}catch(e){}}
function openServiceEditor(i){const s=i==null?{name:'',price:'',duration:90,active:true}:SERVICES[i];openModal(i==null?'Add Service':'Edit Service',`<form class="form" onsubmit="saveService(event,${i==null?'null':i})"><div class="field"><label>项目名称 *</label><input id="sName" required value="${esc(s.name)}"></div><div class="two"><div class="field"><label>单次价格</label><input id="sPrice" type="number" min="0" step="0.01" value="${s.price??''}"></div><div class="field"><label>服务时间（分钟）</label><input id="sDuration" type="number" min="1" value="${s.duration||90}"></div></div><label><input id="sActive" type="checkbox" ${s.active!==false?'checked':''}> 启用这个项目</label><button class="btn dark">Save Service</button></form>`)}function saveService(e,i){e.preventDefault();const x={name:$('sName').value.trim(),price:Number($('sPrice').value||0),duration:Math.max(1,Number($('sDuration').value||90)),active:$('sActive').checked};if(i===null)SERVICES.push(x);else SERVICES[i]=x;saveServices();closeModal();render();toast('项目已保存')}
function settingsView(){return `<div class="card"><div class="top" style="padding:0"><div><h3 style="margin:0">Services</h3><div class="muted">自己新增项目、价格和服务时间</div></div><button class="btn dark" onclick="openServiceEditor()">＋ Add Service</button></div><div class="section">${SERVICES.map((s,i)=>`<div class="row"><div><b>${esc(s.name)}</b><div class="muted">${money(s.price)} · ${s.duration||90} min · ${s.active!==false?'启用':'停用'}</div></div><button class="btn" onclick="openServiceEditor(${i})">Edit</button></div>`).join('')}</div></div><div class="card section"><h3 style="margin-top:0">Historical / Opening Balance</h3><div class="muted">旧顾客余额从顾客详情加入，不会计入今天营业额。</div></div><div class="card section"><button class="btn danger" onclick="resetData()">Reset Demo Data</button></div>`}
function openHistoricalPackage(id){const c=data.customers.find(x=>x.id===id);if(!c)return;openModal('Add Historical / Opening Balance',`<form class="form" onsubmit="saveHistoricalPackage(event,'${esc(id)}')"><div class="muted">旧顾客在 App 上线以前已经购买、现在仍有余额的配套，可以直接把「剩余」录入系统。</div><div class="field"><label>配套类型</label><select id="hType" onchange="toggleHistoricalFields()"><option value="times">次数配套</option><option value="value">Value 配套 · Any Service</option></select></div><div id="hServiceField" class="field"><label>适用项目</label><select id="hService">${SERVICES.filter(s=>s.active!==false).map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div id="hTimesFields"><div class="two"><div class="field"><label>原购买次数</label><input id="hTimes" type="number" min="1" value="3"></div><div class="field"><label>现在剩余次数 *</label><input id="hRemaining" type="number" min="0" value="3"></div></div></div><div id="hValueFields" style="display:none"><div class="two"><div class="field"><label>购买 Value</label><input id="hBuyValue" type="number" min="0" step="0.01"></div><div class="field"><label>赠送 Value</label><input id="hBonusValue" type="number" min="0" step="0.01"></div></div><div class="two"><div class="field"><label>Total PKG Value</label><input id="hTotalValue" type="number" min="0" step="0.01"></div><div class="field"><label>现在剩余 Value *</label><input id="hBalanceValue" type="number" min="0" step="0.01"></div></div></div><div class="two"><div class="field"><label>原购买日期</label><input id="hDate" type="date"></div><div class="field"><label>原配套售价</label><input id="hPrice" type="number" min="0" step="0.01"></div></div><div class="field"><label>备注</label><textarea id="hRemark"></textarea></div><button class="btn dark">✓ Save Opening Balance</button></form>`)}function toggleHistoricalFields(){const v=$('hType').value;$('hServiceField').style.display=v==='times'?'block':'none';$('hTimesFields').style.display=v==='times'?'block':'none';$('hValueFields').style.display=v==='value'?'block':'none'}function saveHistoricalPackage(e,id){e.preventDefault();const c=data.customers.find(x=>x.id===id),type=$('hType').value,date=$('hDate').value||localDate(),price=Number($('hPrice').value||0),remark=$('hRemark').value.trim();if(type==='times'){const t=Math.max(1,Number($('hTimes').value||1)),r=Math.max(0,Math.min(t,Number($('hRemaining').value||0)));data.packages.push({id:'P'+Date.now(),customerId:id,customerName:c.name,service:$('hService').value,times:t,used:t-r,price,originalTotal:price,packageType:'times',source:'historical',purchasedAt:date,remark})}else{const buy=Number($('hBuyValue').value||0),bonus=Number($('hBonusValue').value||0),total=Number($('hTotalValue').value||0)||buy+bonus,bal=Math.max(0,Math.min(total,Number($('hBalanceValue').value||0)));if(total<=0)return toast('请输入 Total PKG Value');data.packages.push({id:'P'+Date.now(),customerId:id,customerName:c.name,service:'Any Service',times:0,used:0,price,originalTotal:0,packageType:'value',source:'historical',purchasedAt:date,remark,buyValue:buy,bonusValue:bonus,totalValue:total,valueBalance:bal})}save().then(()=>{closeModal();render();toast('旧配套余额已加入，不计入营业额')})}
async function resetData(){if(!confirm('确定清除数据库里的全部 V10 数据？'))return;const r=await fetch(API,{method:'DELETE'});if(!r.ok)return alert('清除失败');location.reload()}
loadServices();const savedUser=JSON.parse(sessionStorage.getItem('beyoutiful_user')||'null');if(savedUser&&ACCOUNTS[savedUser.key]&&ACCOUNTS[savedUser.key].role===savedUser.role){currentUser=savedUser;$('loginScreen').style.display='none'}(async()=>{try{await loadData();applyPermissions();render()}catch(e){console.error(e);$('loginError').style.display='block';$('loginError').textContent='数据库 API 暂时无法连接，请检查部署和 DATABASE_URL。';applyPermissions()}})();
</script>
